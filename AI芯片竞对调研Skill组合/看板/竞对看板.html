  <script id="dashboard-data" type="application/json">{"schemaVersion":1,"vendors":["华为","平头哥","海光","昆仑芯","摩尔线程","燧原科技","寒武纪","壁仞科技"],"generatedAt":"2026-11-05T03:05:16.574Z","lastSuccessfulAt":"2026-11-05T03:05:16.574Z","asOf":"2026-11-05T11:05:00+08:00","diagnostics":[],"events":[{"id":"2026-11-05-S01","vendor":"华为","versions":[{"candidateId":"2026-11-05-S01","researchId":"2026-11-05-R01","vendor":"华为","title":"华为／厦门燧弘华创昇腾950DT点亮","summary":"厦门950DT于10月30日举行点亮仪式，成为当地已有384超节点之外的新算力来源。全量验收、卡数与该批设备的收费服务仍待确认。 [项目方供稿](https://www.prnasia.com/story/554029-1.shtml) · [海峡导报现场报道](https://hxdb.fjdaily.com/pc/con/202610/31/content_574141.html)","observationNotes":"","body":"10月19日弘信电子与华为举行首批设备交付仪式。10月21日刊出的项目消息分别给出10月23日前首批服务器到货、28日前集群点亮、30日前全量上线验收的计划。10月30日项目方供稿确认当天在厦门举行950DT点亮仪式，10月31日《海峡导报》记者报道补充会场位于中国移动福建公司厦门分公司。现有报道支持仪式日期和地点，无法据此确认设备首次通电日期、计划节点是否全部兑现，或会场是否就是机房。 [10月21日交付消息](https://jinguxun.com/article/news/10934965) · [10月30日项目方供稿](https://www.prnasia.com/story/554029-1.shtml) · [10月31日海峡导报](https://hxdb.fjdaily.com/pc/con/202610/31/content_574141.html)\n\n此次点亮对应厦门Token工厂的新一批算力，项目方称将与本地已布局的昇腾384超节点及异构资源形成互补。华为产品页列有最多1024个NPU的Atlas 950 SuperPoD液冷配置，厦门材料只明确950DT，未披露机柜、拓扑和实际卡数。此前[武汉项目观察](../2026-10-30/深挖报告.md)中的1024卡也属于另一个具名项目。 [项目方供稿“昇腾950DT点亮”段](https://www.prnasia.com/story/554029-1.shtml) · [昇腾社区液冷超节点规格](https://www.hiascend.com/hardware/cluster?tag=900)\n\n“推理吞吐较初始上线提升50%以上”在10月21日已出现，归因于分桶路由、预填充与解码资源配比调整及并行策略优化，10月30日供稿在双方联合创新段重述。两份稿件均未明确测试使用厦门这批950DT，也未给模型、精度和绝对吞吐。该数字可作为双方推理优化经验的线索，950DT项目的单位词元成本和增益仍待带配置的服务数据。 [10月21日联合创新段](https://jinguxun.com/article/news/10934965) · [10月30日算力产业段](https://www.prnasia.com/story/554029-1.shtml)\n\nHonMaaS与中国移动天工平台厦门方案给出了模型调度、服务交付及私有化部署的入口。供稿与现场报道所列机器人企业属于首批生态合作接入范围，未说明各家是否已在这批950DT上承载生产任务或付费。项目当前可记录为具名算力节点点亮，服务规模仍取决于后续验收、对外开放和实际负载。 [燧弘华创供稿](https://www.prnasia.com/story/554029-1.shtml) · [海峡导报](https://hxdb.fjdaily.com/pc/con/202610/31/content_574141.html)","unknowns":"","evidence":"","batch":"2026-11-05","time":"2026-11-05T11:05:00+08:00","reportId":"report-a8637c0c8618deb4ec2aa07d2d184e645fc2b66d89fe490d21e73d1b5cd22130","sequence":5,"sourceState":"available","testRun":false}]},{"id":"2026-11-05-S02","vendor":"摩尔线程","versions":[{"candidateId":"2026-11-05-S02","researchId":"2026-11-05-R02","vendor":"摩尔线程","title":"摩尔线程／新石器S5000训练验证与无锡惠山扩容","summary":"新石器已在无锡惠山使用S5000进行自动驾驶训练验证，三方于10月31日签署战略合作。走访报道补充一期2,112卡、10月开始商业运营，接近万卡是新石器后续需求。 [惠山发布](https://www.thepaper.cn/newsDetail_forward_34385069) · [芯东西走访](https://zhidx.com/p/606641.html)","observationNotes":"","body":"惠山发布将三方战略签约日期明确为**10月31日**。惠山发布和《上海证券报》均报道新石器已基于S5000进行自动驾驶模型训练验证，并计划扩大训练规模。中关村在线对验证和部署阶段的表述更强，但未提供模型、验证卡数、验收数据或订单条款。现有材料可记录具名训练验证与战略签约，接近万卡的需求、中心万卡级扩容规划以及实际下单规模应分别跟踪。同期披露的10亿元是新石器华东智能无人车总部项目的计划总投资。 [惠山发布](https://www.thepaper.cn/newsDetail_forward_34385069) · [上海证券报援引摩尔线程](https://finance.sina.com.cn/roll/2026-11-02/doc-inixicic0561565.shtml) · [中关村在线](https://ai.zol.com.cn/1268/12683976.html)\n\n相较[10月20日的一期研究](../2026-10-20-02/深挖报告.md)，11月2日芯东西机房走访补充了一期的运营节点及配置，6月点亮、7月试运行、10月开始商业运营，共264台GPU服务器、2,112张S5000。惠山发布沿用“2000卡”的规模口径，两者均指一期。走访稿列算力使用率92.9%、付费算力占比59.7%，未给完整统计窗口和分母定义，不能折算为付费卡数或新石器用量。 [芯东西走访“技术架构”与运营段](https://zhidx.com/p/606641.html) · [惠山发布一期运营段](https://www.thepaper.cn/newsDetail_forward_34385069)\n\n现有项目已经给出从共享集群运营到具名自动驾驶训练验证的案例。若新石器后续锁定长期资源或出现分期扩容交付，将能进一步判断其需求是否转化为集群增量。目前未取得可核对的训练模型与并行配置、实际用卡量、购买或租赁条款和交付时间。 [上海证券报](https://finance.sina.com.cn/roll/2026-11-02/doc-inixicic0561565.shtml) · [芯东西走访](https://zhidx.com/p/606641.html)","unknowns":"","evidence":"","batch":"2026-11-05","time":"2026-11-05T11:05:00+08:00","reportId":"report-a8637c0c8618deb4ec2aa07d2d184e645fc2b66d89fe490d21e73d1b5cd22130","sequence":5,"sourceState":"available","testRun":false}]},{"id":"2026-11-05-S03","vendor":"海光","versions":[{"candidateId":"2026-11-05-S03","researchId":"2026-11-05-R03","vendor":"海光","title":"海光／纵横股份深算三号DCU适配","summary":"纵横股份公布深算三号DCU联合测试时延，覆盖检测、检索和视频处理。公开材料只明确到适配测试阶段，设备安装位置与采购进展仍待确认。 [纵横股份测试原文](https://www.jouav.com/zh/news/elementor-23709.html)","observationNotes":"","body":"纵横股份11月3日披露近期完成联合适配，涉及目标检测、多模态理解、图像分割和视频编解码。披露将机载与地面智能分析软件描述为后续推进迁移的范围，未给出测试硬件所在位置、具体板卡SKU、功耗或精度。以下均为项目方报告的数据。 [纵横股份官网新闻列表](https://www.jouav.com/zh/news/) · [测试原文](https://www.jouav.com/zh/news/elementor-23709.html)\n\n| 负载 | 项目方披露与可比条件 |\n| --- | --- |\n| YOLO11目标检测 | VisDrone2019、10类目标、384×640输入。单帧推理10.9 ms，预处理1.9 ms、后处理1.3 ms，未包含可确认的图传或整链路耗时。 [纵横股份测试原文](https://www.jouav.com/zh/news/elementor-23709.html) |\n| 图像检索 | Qwen3-VL-Embedding-8B通过以文搜图和以图搜图验证，后者Top 5结果相似度均在98%以上，单次推理0.9秒。相似度的口径不足以计算检索准确率。 [纵横股份测试原文](https://www.jouav.com/zh/news/elementor-23709.html) |\n| 编解码与烟火检测 | FFmpeg硬件加速下，1080p视频单帧解码1.078 ms、编码3.37 ms。烟火检测基于ONNX Runtime与ROCm执行后端，单帧推理0.041至0.047秒，项目方CPU对照为0.47秒，未披露CPU配置。 [纵横股份测试原文](https://www.jouav.com/zh/news/elementor-23709.html) |\n\n相比[此前齐鲁银行DCU观察](../2026-10-30/深挖报告.md)，本次是独立行业场景，新增信息是具名应用方明确了DCU代际、负载和部分可定位的时延数据。案例可作为软件迁移和现场分析负载的选型线索。要判断能否进入常态化部署，仍需项目方说明机载、地面站或后台的具体分工，以及实际采购、现场功耗和持续运行表现。 [纵横股份测试原文](https://www.jouav.com/zh/news/elementor-23709.html)","unknowns":"","evidence":"","batch":"2026-11-05","time":"2026-11-05T11:05:00+08:00","reportId":"report-a8637c0c8618deb4ec2aa07d2d184e645fc2b66d89fe490d21e73d1b5cd22130","sequence":5,"sourceState":"available","testRun":false}]},{"id":"2026-10-30-S01","vendor":"华为","versions":[{"candidateId":"2026-10-30-S01","researchId":"2026-10-30-R01","vendor":"华为","title":"华为／武汉昇腾950DT千卡集群","summary":"武汉出现具名投资方和千卡部署报道，增量在地方项目落地；28日点亮与29日上线存在日期口径差异。“首个”也不能覆盖此前10月15日首套点亮。[科创板日报记者稿](https://api3.cls.cn/share/article/2518933?app=&os=android&selected=&source=&sv=869)、[华为10月15日原文](https://www.hiascend.com/activities/dynamic-news/803)。","observationNotes":"","body":"**变化在项目部署，而非规格首次出现。** IT之家10月29日报道，10月28日湖北省人工智能创新发展大会上，由湖北科投投资建设的1024卡集群正式点亮，项目启动到点亮约一个月。科创板日报余诗琪的29日快讯则称“今日上线”。两稿支持武汉项目的公开落地消息，但尚不能精确统一点亮、上线与正式运营日期。[IT之家／沁沧，10月29日13:12，正文已读](https://www.ithome.com/1/019/419.htm)；[财联社页面承载记者快讯，10月29日13:36，相关正文已读](https://api3.cls.cn/share/article/2518933?app=&os=android&selected=&source=&sv=869)。\n\n厂商当前Atlas 950产品页的1024卡配置上限，与项目报道中的1 EFLOPS FP8及256TB统一编址在系列口径上相符，但产品页不是武汉实装清单：\n\n| 层次 | 厂商原始口径 | 对项目判断的限制 |\n| --- | --- | --- |\n| 系统形态 | 16个计算柜＋4个灵衢互联柜，计算柜与互联柜液冷 | 武汉具体机柜与供电验收未披露，不能直接认定完全满配 |\n| 计算配置 | 最多1024颗昇腾950DT、256颗鲲鹏950；最大1 EFLOPS mxFP8／FP8／HiF8 | 峰值规格不是某个万亿参数模型的实测训练能力 |\n| 内存口径 | 256TB全局内存统一编址；另列最多1024×96GB片上内存 | 256TB不能改写为256TB HBM或单任务无条件可用显存 |\n\n以上来自[昇腾官方产品页“产品特性／技术规格”，本轮正文及规格表已读，页面未标发布日期](https://www.hiascend.com/hardware/cluster)。\n\n“全国首个”应保留来源限定。华为10月15日原文已称首套1024卡Atlas 950液冷超节点为Step系列提供算力服务，未在相关段落给出地点；因此武汉可作为新增具名地方部署案例，不能自动解释为全国第一次点亮，也不能认定它与15日机器是同一套或不同一套设备。[昇腾社区，10月15日，“首套1024卡”段，官方正文已读](https://www.hiascend.com/activities/dynamic-news/803)。\n\n据此观察，供给信号已从产品展示推进到具体地区和建设主体。公开信息仍不足以判断开放购买、付费利用率及持续业务负载；这些条件决定该项目后续能否代表可复制的算力服务收入，而不是仅凭点亮规模判断商业成熟度。本轮未取得客户侧运营确认或价格，保留未知。","unknowns":"","evidence":"","batch":"2026-10-30","time":"2026-10-30T10:05:12+08:00","reportId":"report-ea95411acc8d4556bb0f23a65b5f460e9d37c9a45a395d6dcc4e66657e5a68ac","sequence":4,"sourceState":"available","testRun":false}]},{"id":"2026-10-30-S02","vendor":"平头哥","versions":[{"candidateId":"2026-10-30-S02","researchId":"2026-10-30-R02","vendor":"平头哥","title":"平头哥／陕西电信真武M890寻源","summary":"11942.76万元是含税寻源最高限价，采购还涉及CPU服务器及部署服务。256卡是需求规模，不能当成交或裸卡单价依据。[快科技报道](https://news.mydrivers.com/1/1161/1161478.htm)、[采招网列表](https://sx.bidcenter.com.cn/zhaobiao/zbkeyw-33006-0-0-0.html)。","observationNotes":"","body":"**采购意向具体，但阶段仍停在寻源证据。** 快科技10月29日转述27日公告：计划配置32台服务器，每台8张M890 OAM加速卡，合计256卡；11942.76万元含税为最高限价，超价否决；合同后30个工作日供货，原厂免费质保及技术支持为3年。这些是拟采购和履约要求，不是已经签约或已经供货。[快科技／红茶，正文相关段落可读，页面另有权限提示，未继续追取受限部分](https://news.mydrivers.com/1/1161/1161478.htm)。\n\n本轮新增读到采招网27日列表，明确还配置4台CPU服务器，包含设备供货、安装部署、系统调试及运维移交。蓝燕云索引进一步列出管理／网关设备、组网、平台联调和测试验收，但其详情页两次超时，**这些新增细项仅按摘要线索保留**；不能冒充已读电信原公告。[采招网列表，正文片段已读](https://sx.bidcenter.com.cn/zhaobiao/zbkeyw-33006-0-0-0.html)；[蓝燕云公告聚合页，仅搜索摘要](https://sn.zhaobiao.lanyancloud.com/notice/34a5b41ebb1246a8)。\n\n由此可以判断，预算的对象是一组设备及交付服务。不能用11942.76万元除256卡得到M890成交价；媒体“GPU与CPU配比64∶1”实际用了256张加速卡对4台配套CPU服务器，混合了卡与整机单位，也没有计入GPU服务器内部的主处理器，不能当作硬件GPU／CPU芯片比例。[网通社10月29日报道，正文已读，其“64∶1”为媒体表述](https://tech.news18a.com/article/15618)。\n\n市场意义在于：省级运营商的需求已经落实到指定平台、数量和交付约束，而不是泛合作。是否形成订单仍取决于合作伙伴确定及后续采购结果。本轮沿项目名、公告聚合入口及结果方向查找，未取得可确认的成交、合同或验收信息；未检出不能证明这些阶段没有发生。不采用媒体将其称为“1.2亿元订单”的推断，也不把寻源截止后自动视作成交。","unknowns":"","evidence":"","batch":"2026-10-30","time":"2026-10-30T10:05:12+08:00","reportId":"report-ea95411acc8d4556bb0f23a65b5f460e9d37c9a45a395d6dcc4e66657e5a68ac","sequence":4,"sourceState":"available","testRun":false}]},{"id":"2026-10-30-S03","vendor":"海光","versions":[{"candidateId":"2026-10-30-S03","researchId":"2026-10-30-R03","vendor":"海光","title":"海光／齐鲁银行国产化AI算力池","summary":"百余卡部署之外，媒体补充70个AI业务场景测试选型和从OCR逐步扩容的路径；场景测试数量不能当作70个生产应用。[金融界／金曦](https://finance.jrj.com.cn/2026/10/27152158885357.shtml)。","observationNotes":"","body":"**从“百余卡”补充到应用选择与扩容路径。** 北京商报王天逸10月26日转述海光称，DCU近日落地齐鲁银行AI算力池，累计部署百余块，覆盖OCR、多模态及千亿参数级模型。部署日期未给，“累计”不能按本月新增销量计算。[同花顺承载北京商报稿，10月26日21:34，正文已读](https://stock.10jqka.com.cn/20261026/c681105011.shtml)。\n\n金融界金曦27日进一步写到，此前进行70个AI业务场景的测试选型，从OCR切入，逐步延伸至多模态和大模型，并采用统一集群调度与存量业务适配方案。这使案例的价值从设备数量进一步延伸到业务迁移，但它仍是媒体案例描述：70是测试选型范围，不能扩大为70个已上线生产系统，也没有公开每个场景的验收或使用率。[金融界，10月27日15:21，“百卡级部署／从场景起步”部分，重试后正文已读](https://finance.jrj.com.cn/2026/10/27152158885357.shtml)。\n\n据此判断，这条路径对区域银行有参考价值：先验证存量应用再扩充共享算力池，可能降低一次性迁移和运维压力。这里的“可能”是研究分析，不能据报道确认实际节约金额或投资回报。两篇媒体稿不能视为银行与供应商两方独立确认；本轮未取得银行侧确认、精确型号及金额，因而不推算海光收入，也不由通用DCU能力介绍反推该项目用了某代产品。","unknowns":"","evidence":"","batch":"2026-10-30","time":"2026-10-30T10:05:12+08:00","reportId":"report-ea95411acc8d4556bb0f23a65b5f460e9d37c9a45a395d6dcc4e66657e5a68ac","sequence":4,"sourceState":"available","testRun":false}]},{"id":"2026-10-30-S05","vendor":"燧原科技","versions":[{"candidateId":"2026-10-30-S05","researchId":"2026-10-30-R04","vendor":"燧原科技","title":"燧原科技／百万token推理与KV缓存优化","summary":"百万token推理在8月Hy4 preview适配供稿中已出现，10月大会更多是延续展示；多层KV缓存有明确技术方向，但没有可复现的版本、配置与吞吐依据。[8月厂商供稿](https://www.laoyaoba.com/n/1095357)、[10月大会供稿](https://www.ijiwei.com/n/1128148)。","observationNotes":"","body":"**本轮最有用的修正是时间线。** 10月29日大会供稿称，通过算子融合、显存优化、智能调度、高效传输与多层级KV Cache，发挥PD分离优势，实现百万token长上下文高吞吐稳定推理。该稿未给模型、卡数、缓存介质、软件版本及量化服务指标。[爱集微承载燧原供稿，正文事件日期10月29日，相关段落已读；不是独立实测](https://www.ijiwei.com/n/1128148)。\n\n8月28日燧原的Hy4 preview适配供稿已经把百万token、PD分离、集群大EP及KV Cache优化放在同一方案中，并称满足业务SLO。该稿给出了Hy4 preview这一模型背景，足以说明“百万token能力”并非10月首次提出；但不能据此认定10月展出的所有配置都等同8月方案。[爱集微承载厂商原稿，8月28日20:36，正文已读](https://www.laoyaoba.com/n/1095357)。\n\n技术方向是把长上下文压力作为整套推理服务的问题处理，覆盖计算、通信、调度与缓存，而非单靠更大显存。这是对两份厂商材料的分析；现有材料不能把多层缓存进一步填成指定的HBM／主存／SSD结构，或推定某种公开软件版本已经交付。大会所说“第三代算力产品”也不足以把现场方案直接对应到第四代L600或某一张卡。\n\n因此，市场观察由初筛的“可能新能力”调整为“既有能力主张的继续展示，具体工程交付仍待观察”。下一次值得关注的增量是可用版本与同条件下的首字延迟、逐token延迟和吞吐，而不是再次出现“支持1M”的宣传。模型自优化或其他硬件的吞吐数字不移用为燧原测试结果。本轮未安装环境或运行模型。","unknowns":"","evidence":"","batch":"2026-10-30","time":"2026-10-30T10:05:12+08:00","reportId":"report-ea95411acc8d4556bb0f23a65b5f460e9d37c9a45a395d6dcc4e66657e5a68ac","sequence":4,"sourceState":"available","testRun":false}]},{"id":"2026-10-30-S09","vendor":"摩尔线程","versions":[{"candidateId":"2026-10-30-S09","researchId":"2026-10-30-R05","vendor":"摩尔线程","title":"摩尔线程／S5000商业进展与收入边界","summary":"正式半年报支持“以云端产品为主的商业化”；6.60亿元夸娥合同已在上半年交付确认收入。三季报增长与S5000有关，但公司收入仍不能拆算S5000收入或卡价。[半年报第66、144页](https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-8/2026-08-10/12484622.PDF)、[三季报](https://static.cninfo.com.cn/finalpage/2026-10-29/1225636387.PDF)。","observationNotes":"","body":"**正式披露支持云端产品为收入主体，但不支持S5000单型号拆分。** 半年报合并口径：上半年云端产品收入1692662049.69元，占总收入1736309066.25元约97.49%（本轮按两数相除）；第66页记载6.60亿元夸娥智算集群合同已在上半年交付并确认收入。这是既有商业化依据，不能再次计作三季度或10月新签订单。[2026年半年报，第66、144页，新浪披露原件复本，相关正文及表格已读](https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-8/2026-08-10/12484622.PDF)。\n\n| 期间／对象 | 原始披露数值 | 可支持的判断 |\n| --- | --- | --- |\n| 第三季度公司营业收入 | 1552307664.26元，同比＋1773.92% | 单季度公司收入扩大，不等同S5000收入 |\n| 前三季度公司营业收入 | 3288616730.51元，同比＋319.15% | 累计收入规模，不能再加上已包含的集群合同 |\n| 前三季度经营现金流净额 | −3309197894.09元 | 收入增长同时伴随采购现金占用，不能用收入代替现金回收 |\n\n数据来自[三季报第1页](https://static.cninfo.com.cn/finalpage/2026-10-29/1225636387.PDF)。第3页将增长与S5000等智算产品在CSP、TSP、运营商等客户中加速落地关联，并将经营现金净流出归因于扩大生产和战略备货。它没有给出S5000销售额、卡数、客户分项及成交价。半年报的97.49%不能直接套到三季度，更不能把云端产品收入全部改称裸芯片收入。[同份三季报第3页，正式披露相关段落已读](https://static.cninfo.com.cn/finalpage/2026-10-29/1225636387.PDF)。\n\n观察重点由“营收增长”推进到“云端收入结构及合同转收入已有依据”。同时，集群业务包含不同设备和服务，收入扩张、单卡销量及单位经济性仍是不同问题。现有披露未支持对集群金额和卡收入进行重复累计；也没有具体证据可判断存在重复确认收入。官网10月28日图解、媒体称28日晚发布与披露库29日日期保留各自口径，不据此构造两次新披露。","unknowns":"","evidence":"","batch":"2026-10-30","time":"2026-10-30T10:05:12+08:00","reportId":"report-ea95411acc8d4556bb0f23a65b5f460e9d37c9a45a395d6dcc4e66657e5a68ac","sequence":4,"sourceState":"available","testRun":false}]},{"id":"2026-10-30-S11","vendor":"寒武纪","versions":[{"candidateId":"2026-10-30-S11","researchId":"2026-10-30-R06","vendor":"寒武纪","title":"寒武纪／云端产品经营、备货与销售传闻","summary":"云端收入基础有半年报支持，三季度继续增长；库存同时包含订单需求和预测备货，不能推成已锁定销量。管理层称未沟通过明年百万颗出货说法。[半年报](https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12484346&stockid=688256)、[每经现场问答报道](https://www.nbd.com.cn/articles/2026-10-26/4618733.html)。","observationNotes":"","body":"**收入结构有更直接的依据。** 半年报合并收入分解列上半年云端产品线5994218575.37元、公司总收入5995573619.61元，云端占比约99.98%（本轮计算）；说明此前增长确以云端产品为主，而非必须借公司总收入猜测。该口径仍不是思元某一型号销量或收入。[2026年半年报，附注“营业收入、营业成本的分解信息”，新浪承载公司公告，表格已读](https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12484346&stockid=688256)。\n\n三季报列前三季度公司营业收入9526401914.25元，第三季度3530828294.64元；截至9月末，存货11664658998.55元、预付款3044359094.99元。它们分别是期间收入与期末资产，不能相加为订单储备，也不能将库存全部理解成已售芯片。[2026年三季报第1、6页，巨潮资讯原件，相关表格已读](https://static.cninfo.com.cn/finalpage/2026-10-24/1225620944.PDF)。\n\n10月26日业绩会每经报道补充：管理层称采购计划同时依据客户订单与未来需求预测；对市场“明年出货超100万颗”说法，回答是**从未进行相关沟通**，并未提供新的出货指引。思元690销售及导入大厂的问题也没有得到具体数量和时点。这里否认的是沟通过该数字，不能延伸为对所有未来产能的确定结论。[每日经济新闻／可杨，10月26日20:17，原创报道正文已读](https://www.nbd.com.cn/articles/2026-10-26/4618733.html)。\n\n公司研究室26日的业绩会整理还转述“前三季度主要来自云端且不包含智能计算集群系统业务”；这一更细分说法有可读媒体／社区入口，但本轮未取得上证路演原始问答，不把它升级为已经核读的交易所披露。[雪球承载公司研究室文章，10月26日21:12，正文已读](https://www.xueqiu.com/1479845370/413930436)。正式半年报已提示原材料采购价格上涨、通过备货和迭代应对；这属于成本压力，不能当作公司芯片售价已经上涨的证据。[半年报“行业风险”，公司公告正文已读](https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12484346&stockid=688256)。\n\n据此，云端产品的商业收入基础比初筛仅用总收入表述更明确；未来销售判断仍应观察订单转交付与库存周转，避免把资产规模或市场出货传闻当确定销量。客户、型号贡献及具体成交价格仍未披露，本轮不据此确认690量产或估算单卡价格。","unknowns":"","evidence":"","batch":"2026-10-30","time":"2026-10-30T10:05:12+08:00","reportId":"report-ea95411acc8d4556bb0f23a65b5f460e9d37c9a45a395d6dcc4e66657e5a68ac","sequence":4,"sourceState":"available","testRun":false}]},{"id":"2026-10-20-03-S01","vendor":"华为","versions":[{"candidateId":"2026-10-20-03-S01","researchId":"2026-10-20-03-R01","vendor":"华为","title":"华为1024卡Atlas 950 SuperPoD与Step 5 Preview","summary":"华为1024卡Atlas 950已有官方规格和7月展示记录；10月15日的价值在于与Step 5结合的运行消息，不能称硬件首次发布。模型部署文档仍标实验性支持。[华为7月原文](https://www.huawei.com/cn/news/2026/7/atlas-950-superpod)、[vLLM Ascend指南](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Step-5-Preview.html)。","observationNotes":"身份与软件边界已核，实际点亮地点、验收、报价及系统实测未核。","body":"**产品身份与时间线。** 华为2026年7月17日WAIC原文已称首次线下展出1024卡Atlas 950真机，并披露1 EFLOPS FP8、2 EFLOPS FP4、256TB统一编址及3μs RTT。因此这些规模与规格不是10月15日首次出现；7月展示地点上海也不能自动认定为10月点亮地点。[华为官方发布，2026-07-17，“真机首次亮相”部分](https://www.huawei.com/cn/news/2026/7/atlas-950-superpod)。\n\n10月15日具名媒体报道首套1024卡液冷超节点随Step 5权重开源同步上线点亮；这是媒体转述的运行事件。本轮仍未取得对应地点、客户身份和验收原件，不能将“点亮”升级为正式验收、批量交付或可订购云服务。[IT之家／问舟，2026-10-15 22:07](https://m.ithome.com/html/1013663.htm)。\n\n**规格可核，但配置不能拼接。** 当前官方产品页给出下列1024卡配置上限，属于厂商规格，非本轮实测或某客户实装清单。\n\n| 对象 | 官方页面口径及解释 | 来源 |\n| --- | --- | --- |\n| 系统及芯片 | 16个计算柜＋4个互联柜；最多1024颗昇腾950DT、256颗鲲鹏950；计算柜和互联柜均液冷。 | [昇腾官方产品页，“技术规格”](https://www.hiascend.com/hardware/cluster) |\n| 算力与内存 | 最大1 EFLOPS mxFP8／FP8／HiF8、2 EFLOPS mxFP4；页面另列1024×96GB片上内存。256TB是全局统一编址口径，不能直接写成等量HBM或单任务可用显存。 | [昇腾官方产品页，“产品特性／技术规格”](https://www.hiascend.com/hardware/cluster) |\n| 互联及供电 | 单柜互联最大64×1.68TB/s（双向）；页面有“100kW供电”表述，但未在该处明确整套20柜边界，不能作为系统总功耗测值或直接计算运行成本。 | [昇腾官方产品页](https://www.hiascend.com/hardware/cluster) |\n\n华为3月2日另一篇Atlas 950材料则介绍单柜64卡、最大8192卡互联。不同时间材料的系列名称相同，并不证明与本次1024卡配置完全等同；不能把8192卡上限、1024卡规格和实际点亮数量混写成一套已交付产品。[华为MWC原文，2026-03-02](https://www.huawei.com/cn/news/2026/3/mwc-superpod-ai)。\n\n**模型软件的进展与限制。** vLLM Ascend公开指南限定950DT，使用Step-5-Preview-w8a8-mxfp8权重和专用镜像`quay.io/ascend/vllm-ascend:step5-a5-openeuler`，列出HDK 25.5.0、CANN 9.2.0、torch_npu 2.10.0.post4及基于v0.27.0的框架组合；当下不支持该模型的源码安装。[项目指南，§1、§3、§4](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Step-5-Preview.html)。\n\n指南展示双节点TP4、DP4、每节点DP2及MTP参数，提供精度结果；性能章节没有1024卡吞吐或时延测值，且明确性能优化与服务可靠性验证仍在进行、不建议直接用于生产。双节点示例不能充当整套1024卡系统的测试报告。[项目指南，§5、§7—9](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Step-5-Preview.html)。\n\n部署文档PR #18774已于10月15日16:20:02（北京时间）合并，但PR说明此次为文档更新。**文档合入与模型支持代码完整合入是不同状态**，前者不推翻指南对源码安装的限制。[PR原文](https://github.com/vllm-project/vllm-ascend/pull/18774)、[GitHub接口中的合并时间](https://api.github.com/repos/vllm-project/vllm-ascend/pulls/18774)。\n\n**竞争含义。** 证据支持从硬件展示进一步走向具体前沿模型的可体验部署，这是有价值的工程进展。是否已成为稳定、可采购且有成本优势的生产系统，仍取决于整机验收、负载实测和服务供给。现有资料不足以确认“性能持平海外先进算力”，也不支持计算单卡价格、tokens成本或市场份额。","unknowns":"| 候选 | 影响判断的未知 | 能推进核验的材料 |\n| --- | --- | --- |\n| S01／R01 | 10月点亮的具体地点及运营／客户主体；与7月展出机器的关系；正式验收、供货和报价；1024卡下同条件吞吐、时延、故障恢复及总功耗。 | 具体项目的客户／厂商原始运行公告、配置及验收文件、正式报价；含模型、精度、长度、并发和测量方法的系统测试报告。 |","evidence":"","batch":"2026-10-20-03","time":"2026-10-20T18:29:00+08:00","reportId":"report-f4af0c2f6a38a694a88ff5587ee61ff8d9eabe27e2665d817238726e52af8f02","sequence":1,"sourceState":"available","testRun":false}]},{"id":"2026-10-20-03-S04","vendor":"摩尔线程","versions":[{"candidateId":"2026-10-20-03-S04","researchId":"2026-10-20-03-R02","vendor":"摩尔线程","title":"摩尔线程MTT S5000／MUSA的Step 5适配","summary":"摩尔线程已有SGLang通用MUSA接入和安装原件；Step 5专用适配目前主要由产品技术稿描述，尚未形成可核的“具体版本／镜像＋配置＋量化结果”闭环。[SGLang安装PR](https://github.com/sgl-project/sglang/pull/36709)、[DOIT技术稿](https://www.doit.com.cn/ai/859904890085445.html)。","observationNotes":"通用软件可用路径已核，模型专用交付物与性能未核。","body":"**模型能力与硬件能力分开核。** StepFun官方仓库描述Step 5为600B总参数、27B激活、最高1M上下文的多模态模型；这些是模型属性，不等于在S5000上已验证全部上下文、模态和并发组合。[StepFun模型仓库，“Introduction／Deployment”](https://github.com/stepfun-ai/Step-5-Preview)。摩尔线程S5000官方产品页确认硬件原生FP8支持；其其他训练宣传不能替代Step 5推理测评。[S5000官方页，“FP8原生算力”](https://mthreads.com/product/S5000)。\n\n**本次适配实际宣布了什么。** 10月15日DOIT技术稿称S5000及MUSA完成Day-0适配，具体包括：\n\n- SGLang-MUSA下的混合滑窗／稀疏注意力、TP8／EP8切分；\n- FP8 DeepGEMM以及BF16／FP32混合精度路径；\n- Decode专家派发优化、MTP3、Vision Encoder与Projector接入。\n\n这些属于媒体承载的产品技术介绍，本轮没有取得同一实验的代码提交、镜像摘要或完整测试日志，不能写为独立复验结果。[DOIT，2026-10-15，“全链路适配与调优”各小节](https://www.doit.com.cn/ai/859904890085445.html)。TP8／EP8是其描述的并行设置，不足以补齐服务器、互联、权重、batch及上下文等测试配置；MTP3也不等于实际速度提升四倍。\n\n**公开软件基础可以确认。** SGLang MUSA路线图的维护者早在1月29日就说明已能用MUSA运行单卡／多卡，并列出持续演进的内核、运行时和CI工作。因此10月这次新增是具体模型适配，不能称首次实现SGLang支持。[SGLang Issue #16565，维护者2026-01-29评论](https://github.com/sgl-project/sglang/issues/16565)。\n\n安装PR #36709于9月7日合并，内容包括MUSA Dockerfile、安装说明与依赖配置；该PR明确限定为安装支持，运行时能力另行跟踪。其文档通过Moore Threads软件源安装MUSA依赖并构建镜像，验证示例是Qwen3-8B，**不是Step 5专用交付或测试**。[安装PR](https://github.com/sgl-project/sglang/pull/36709)、[项目接口中的文档变更](https://api.github.com/repos/sgl-project/sglang/pulls/36709/files)。\n\n**模型专用可用性仍有缺口。** 当前SGLang的Step 5专用cookbook称支持尚未进入正式SGLang release，使用预览镜像`lmsysorg/sglang:step-5-preview`，验证矩阵为B300／H200。这不能当作S5000镜像或命令直接复用；也不能反向断言厂商适配不存在。[SGLang原始cookbook，“Deployment／Per-platform notes”](https://github.com/sgl-project/sglang/blob/main/docs/cookbook/autoregressive/StepFun/Step-5-Preview.mdx)。厂商SGLang-MUSA介绍及发行说明本轮未取到正文，其搜索摘要不用于确认Step 5版本。\n\n**竞争含义。** 原生软件生态已有基础，模型稿也提供了具体优化方向，说明调查价值高于一句泛化的“适配完成”。但当前证据尚不能证明用户可从一个公开固定版本复现全部宣布功能，更不足以支持吞吐领先、低成本或生产稳定性的判断。尚缺同配置下的tokens/s、TTFT／TPOT、长上下文实测长度、MTP接受率及长时间运行记录。","unknowns":"| 候选 | 影响判断的未知 | 能推进核验的材料 |\n| --- | --- | --- |\n| S04／R02 | Step 5专用MUSA提交、固定版本和镜像；实际服务器与卡数；1M上下文、模态和并发的已验证范围；量化精度与长期稳定性。 | 厂商发布说明和镜像digest、完整启动配置、可核社区PR／提交；精度与吞吐日志、MTP开关对照及稳定性记录。 |","evidence":"","batch":"2026-10-20-03","time":"2026-10-20T18:29:00+08:00","reportId":"report-f4af0c2f6a38a694a88ff5587ee61ff8d9eabe27e2665d817238726e52af8f02","sequence":1,"sourceState":"available","testRun":false}]},{"id":"2026-10-20-03-S05","vendor":"壁仞科技","versions":[{"candidateId":"2026-10-20-03-S05","researchId":"2026-10-20-03-R03","vendor":"壁仞科技","title":"壁仞SUPA接入Megatron-LM-FL","summary":"**初筛的状态冲突已解决：PR #199确于10月15日合入**，主线也能读取SUPA适配文件；初筛取得的是旧页面。代码合入不能等同正式版本、真实训练验证或客户交付。[GitHub原始接口](https://api.github.com/repos/flagos-ai/Megatron-LM-FL/pulls/199)、[合并提交](https://github.com/flagos-ai/Megatron-LM-FL/commit/bbc208e00f2a201783938ef549f5058d6047e4c0)。","observationNotes":"合入争议核验完成，发布版本及端到端硬件训练能力仍缺证据。","body":"**状态冲突已解决，保留初筛记录并追加更正。** 本轮重新读取原始PR及GitHub接口，确认PR #199为`merged=true`，合并时间为2026年10月15日11:05:13 UTC，即北京时间**19:05:13**，合并提交为`bbc208e00f2a201783938ef549f5058d6047e4c0`。初筛旧页显示Open，不能据此继续判断未合入；第三方汇总的合入日期已获原始记录支持。[GitHub PR #199](https://github.com/flagos-ai/Megatron-LM-FL/pull/199)、[原始接口](https://api.github.com/repos/flagos-ai/Megatron-LM-FL/pulls/199)。\n\n**合入范围比“完整训练栈就绪”窄。** 实际合并提交修改3个文件：平台注册、SUPA平台适配、平台测试，共新增371行／删除4行。PR描述提及的其他文件不应当作最终实际改动清单。SUPA采用独立的torch设备类型，兼容层将CUDA调用导向SUPA，通信后端为BCCL；这些是设备和运行时接口接入。[最终合并提交及文件列表](https://github.com/flagos-ai/Megatron-LM-FL/commit/bbc208e00f2a201783938ef549f5058d6047e4c0)、[原始文件变更接口](https://api.github.com/repos/flagos-ai/Megatron-LM-FL/pulls/199/files)。\n\n本轮亦从main读取到`platform_supa.py`，确认适配已存在于主线。文件实现设备、内存、流及图执行接口，同时`is_triton_supported()`返回False，编译后端和若干监测接口仍有空实现。这只说明**该适配层的当前支持范围**，不能推为壁仞全软件栈没有Triton或编译能力。[主线原文件](https://github.com/flagos-ai/Megatron-LM-FL/blob/main/megatron/plugin/platform/platform_supa.py)、[GitHub内容接口](https://api.github.com/repos/flagos-ai/Megatron-LM-FL/contents/megatron/plugin/platform/platform_supa.py?ref=main)。\n\n**测试与版本需要继续分层。** 新增测试包含模拟后端和设备契约测试；PR页面的跨平台检查数量不能代替指定壁仞卡上真实多卡训练的通过证明。本轮没有取得型号、模型、卡数、loss曲线、吞吐及稳定性组成的端到端验证记录。[最终测试改动](https://github.com/flagos-ai/Megatron-LM-FL/pulls/199/files)。\n\n读取到的项目发布列表最新条目为9月28日v0.3.0；版本与此次合并提交的比较显示分支有分歧，不能将当前main的SUPA功能视为该标签已经包含。现阶段可确认的是主线代码可读，尚未确认承载此次支持的正式发布标签或可交付镜像。[发布列表接口](https://api.github.com/repos/flagos-ai/Megatron-LM-FL/releases?per_page=5)、[v0.3.0与合并提交的比较](https://api.github.com/repos/flagos-ai/Megatron-LM-FL/compare/v0.3.0...bbc208e00f2a201783938ef549f5058d6047e4c0)。\n\n**竞争含义。** 这是FlagOS的Megatron-LM-FL项目接入，不能扩大成NVIDIA上游Megatron-Core已原生支持壁仞，也不代表某型号已量产交付。可确认的增量是平台正式进入该项目主线；真实训练覆盖和产品交付成熟度，需要硬件验证与正式软件发布继续补足。","unknowns":"| 候选 | 影响判断的未知 | 能推进核验的材料 |\n| --- | --- | --- |\n| S05／R03 | 承载SUPA接入的正式标签／镜像；适用GPU、torch_supa／BCCL版本；真实模型和多卡训练验证，以及当前适配层限制。 | 包含合并提交的版本清单、依赖与环境矩阵；指定壁仞硬件上的训练日志、CI记录、loss和吞吐／稳定性测试。 |","evidence":"","batch":"2026-10-20-03","time":"2026-10-20T18:29:00+08:00","reportId":"report-f4af0c2f6a38a694a88ff5587ee61ff8d9eabe27e2665d817238726e52af8f02","sequence":1,"sourceState":"available","testRun":false}]},{"id":"2026-10-20-02-S01","vendor":"平头哥","versions":[{"candidateId":"2026-10-20-02-S01","researchId":"2026-10-20-02-R01","vendor":"平头哥","title":"平头哥真武V900与磐久系统","summary":"V900发布规格和2027年Q1量产商业发布计划已有阿里集团原文支持；当前不能据此认定已量产或交付。[阿里集团，2026-09-25，“New silicon from T-Head”](https://www.alibabagroup.com/en-US/document-2041268239081668608)","observationNotes":"性能可比条件、实际供货和价格仍未知。","body":"**规格与性能。** 阿里集团9月25日原文将V900定义为训练与推理处理器，公布216GB显存、1200GB/s片间互联及原生FP8/FP4支持，宣称性能为M890三倍。该段没有提供绝对FLOPS、稠密／稀疏口径、模型、批量、序列长度、软件版本和测量方法；显存类型、显存带宽、功耗、互联单双向口径也未列出。[阿里集团，2026-09-25，“New silicon from T-Head”](https://www.alibabagroup.com/en-US/document-2041268239081668608)\n\n因此，“三倍”可以记录为厂商相对前代的宣称，不能换算成与其他厂商卡型的普遍领先幅度。本轮未取得独立实测或可复现基准；不采用社区文章中的推测制程、功耗和互相冲突的显存配置。\n\n**系统关系。** 集团原文称升级超节点服务器集成V900、ICN Switch、磐脉SmartNIC及镇岳SSD控制芯片，并给出最高50万卡的集群扩展目标。这是系统层面的架构容量描述，不能读成单台服务器50万卡或已建成50万卡客户集群。[阿里集团，2026-09-25，同节](https://www.alibabagroup.com/en-US/document-2041268239081668608) 9月22日汪淼的现场报道将该服务器称为“全新磐久超节点服务器”，上市时间为2027年Q1；这是记者现场记录，非独立性能测试。[IT之家，2026-09-22 11:18，正文](https://m.ithome.com/html/1005602.htm)\n\n**供货与价格。** 集团原文使用“scheduled”表述2027年Q1量产和商业发布，仍属未来计划。现场稿中的“已对外提供服务”对应M890的GP9A实例，不能移植为V900供货证明；该区分仅用于解释本选题，不另研究GP9A。[阿里集团，2026-09-25](https://www.alibabagroup.com/en-US/document-2041268239081668608)，[IT之家，2026-09-22](https://m.ithome.com/html/1005602.htm) 本轮未取得截至检索截止的V900实际交付文件、可购买配置、公开报价或可分离的采购成交记录，价格留空。\n\n**对判断的影响。** 当前能确认的是新品发布口径和系统产品计划。显存容量、互联及低精度支持值得继续关注，但能否改善目标模型吞吐、成本和交付能力，需要实际配置、基准及客户材料才能判断。","unknowns":"- **R01／部分完成：** 需要带精度、稠密性、功耗和任务条件的V900正式规格／基准，及截至实际供货时的配置、合同或报价。现有“三倍”与扩展上限不足以进行跨厂商性能或成本排名；未检出交付并不证明交付不存在。","evidence":"","batch":"2026-10-20-02","time":"2026-10-20T11:13:45+08:00","reportId":"report-a6656a9e37b71493a4eeef012fdddf10f8b6b89622889c986bba4da7557c82d4","sequence":2,"sourceState":"available","testRun":true}]},{"id":"2026-10-20-02-S04","vendor":"壁仞科技","versions":[{"candidateId":"2026-10-20-02-S04","researchId":"2026-10-20-02-R02","vendor":"壁仞科技","title":"壁仞BR20X点亮与商业化阶段","summary":"公告确认“新一代产品”完成启动测试、进入流片后验证；未来送样量产有验证认证前提。[10月8日公告PDF复本，第7页](https://www.sl886.com/track/index?id=4546351&type=hkexnews)","observationNotes":"阶段已核；公告未直接点名BR20X，后续实际送样量产无可核证据。","body":"**公告核读与身份。** 本轮取得《根据一般授权配售新H股》14页PDF复本，文末署期2026年10月8日；通过SL886公告链接读取，未将其冒称港交所原站直接访问。第7页明确写新一代产品已完成启动测试、进入流片后验证；未来数季度客户送样及量产“惟须待圆满完成验证及认证后方可作实”。[公司公告PDF复本，2026-10-08，第7页](https://www.sl886.com/track/index?id=4546351&type=hkexnews)\n\n该段使用“新一代产品”，并未直接列BR20X型号。第一阶段已读的集邦咨询及具名原创报道将其指认为BR20X，型号对应仍按媒体指认保留，不能把公告读成已明确给出型号和详细规格。[集邦咨询，2026-10-08，正文](https://www.trendforce.cn/industry-news/semiconductors/20261008-8382.html)，[IPO早知道，2026-10-08，搜狐承载](https://www.sohu.com/a/1085077478_100171209)\n\n**阶段边界。** 公告第7页还说明，供应链采购和生产准备需要与验证、客户适配认证并行。这支持“已经进入验证且提前备货”的判断；没有证明客户认证完成、送样已发生、量产良率达标或已规模交付。未给明确量产季度，不能把“未来数季度”补写为确定的2027年某季度。[公司公告PDF复本，2026-10-08，第7页](https://www.sl886.com/track/index?id=4546351&type=hkexnews)\n\n**解决配售日期冲突。** 10月8日公告是有条件配售协议；随后《完成根据一般授权配售新H股及修订公司章程》公告明确交割发生于10月12日。两份PDF能够纠正10月8日媒体所写“已完成配售”的时间口径。[10月8日公告PDF复本，第1—2页](https://www.sl886.com/track/index?id=4546351&type=hkexnews)，[10月12日完成公告PDF复本，第1页](https://www.sl886.com/track/index?id=4548295&type=hkexnews) 融资交割与产品量产是独立事件，前者不能替代后者的证据。\n\n**对判断的影响。** 点亮后验证是实质阶段进展，同时意味着仍有认证与生产爬坡风险。现阶段最有判断价值的是下一次明确送样、认证或量产公告；匿名“超过H200”说法缺测试条件，本轮不采纳。","unknowns":"- **R02／部分完成：** 需要公司直接点名BR20X的对应文件，以及后续送样、客户认证、良率和量产披露。两份配售公告均通过第三方入口取得PDF复本，原站文件一致性未单独核对；原文阶段边界已保留。","evidence":"","batch":"2026-10-20-02","time":"2026-10-20T11:13:45+08:00","reportId":"report-a6656a9e37b71493a4eeef012fdddf10f8b6b89622889c986bba4da7557c82d4","sequence":2,"sourceState":"available","testRun":true}]},{"id":"2026-10-20-02-S05","vendor":"摩尔线程","versions":[{"candidateId":"2026-10-20-02-S05","researchId":"2026-10-20-02-R03","vendor":"摩尔线程","title":"摩尔线程无锡（惠山）智算中心一期","summary":"一期2000卡S5000已运行、基本满载的报道在9月2日即存在；10月16日官网条目不能作为首次满载日期。[新京报转载，2026-09-02](https://www.bjnews.com.cn/detail/1788335834129757.html)","observationNotes":"卡型与早期时间线有依据；验收、付费利用率、项目收入未核实。","body":"**卡型、规模与主体。** 惠山区政府7月24日正文称一期基于MTT S5000、采用夸娥集群系统，已部署“超2000张”；新京报9月2日承载的企业资讯转载称一期2000张S5000全部运行，投资建设方为无锡移动惠山分公司，摩尔线程提供GPU、集群系统和软件栈。“2000／超2000”保留各自来源口径，不人为统一精确值。[惠山区政府，2026-07-24，“千P级算力底座”](https://www.huishan.gov.cn/doc/2026/07/24/4809561.shtml)，[新京报转载，2026-09-02，正文](https://www.bjnews.com.cn/detail/1788335834129757.html)\n\n“万卡级”不能直接当作一期已装1万卡：上述转载明确一期2000卡是起步，后续向万卡规模推进。区政府文中尚航基地近1.6万张卡也是另一统计对象，不应计入本项目一期。[新京报转载，2026-09-02，后续建设段](https://www.bjnews.com.cn/detail/1788335834129757.html)，[惠山区政府，2026-07-24](https://www.huishan.gov.cn/doc/2026/07/24/4809561.shtml)\n\n**时间线与满载口径。** 政协无锡网6月14日正文记载，在6月11日活动上智算中心一期正式点亮。[政协无锡网，2026-06-14，活动段](https://zx.wuxi.gov.cn/doc/2026/06/14/4790732.shtml) 9月1日媒体正文将机房走访定在8月25日，称一期2000张S5000全部投运、基本满载；9月2日转载进一步引述无锡移动惠山分公司总经理包彦成，称需求持续增长、基本达到满载。因此至少到8月下旬已出现满载说法，并非10月首次发生。[新浪财经，2026-09-01，机房走访段](https://finance.sina.com.cn/roll/2026-09-01/doc-iniqiaty1629977.shtml)，[新京报转载，2026-09-02，包彦成表述](https://www.bjnews.com.cn/detail/1788335834129757.html)\n\n“基本满载”仍是需求与运营表述，材料没有给测量周期、GPU利用率、可计费卡时、付费客户比例或收入对应关系，不能解释成100%付费利用率。10月16日官网仅标题与日期可见，本轮未重复追取已受限正文。[摩尔线程官方条目，2026-10-16，标题日期可见](https://mthreads.com/news/353)\n\n**客户、验收与收入。** 9月2日转载引述运营方：20多家客户在测试或正式使用，不能全部计作付费客户；文中具名转述南京邮电大学孙洪波团队与惠山区人民医院项目调用算力，但不附采购或验收文件。[新京报转载，2026-09-02，运营及医疗段；页面注明来源日照新闻网](https://www.bjnews.com.cn/detail/1788335834129757.html) 9月29日无锡日报稿列举招商、医疗、教育及芯片设计智能体，属于应用进展报道，可用于识别场景，不能替代这些客户的合同和付费确认。[无锡日报，2026-09-29，新浪承载正文](https://finance.sina.com.cn/roll/2026-09-29/doc-initnwnf2860674.shtml)\n\n本轮未取得项目硬件采购明细、正式验收报告、收费合同、到账或分项目收入披露。运行报道支持“已投运”的公开说法，但不能据此确认采购方验收、摩尔线程该项目收入金额或收入确认期间。也不能用公司总营收填充这一缺口。","unknowns":"- **R03／部分完成：** 需要运营方的负载定义、监控期间与付费卡时；项目验收及合同、发票／回款或分项目收入披露。媒体中的20多家使用者和六类应用尚不足以量化收入，客户自行发布的验收证明未取得。","evidence":"","batch":"2026-10-20-02","time":"2026-10-20T11:13:45+08:00","reportId":"report-a6656a9e37b71493a4eeef012fdddf10f8b6b89622889c986bba4da7557c82d4","sequence":2,"sourceState":"available","testRun":true}]},{"id":"2026-10-20-S01","vendor":"平头哥","versions":[{"candidateId":"2026-10-20-S01","researchId":"2026-10-20-R01","vendor":"平头哥","title":"真武V900","summary":"V900正式发布，官方公布216GB、1,200GB/s片间带宽、FP8/FP4，2027Q1量产销售为计划；50万卡属于集群能力宣称","observationNotes":"三倍性能条件、ICN实测和实际交付未证；部分规格数字5月已有披露，9月计划较5月前移","body":"**完成程度：部分完成。** 发布事件、厂商公布的规格及量产上市计划已有原始官方材料支持；“三倍”性能条件、ICN实测规模及V900实际交付仍缺关键证据。已合理追查官方新闻、开发者入口、现场报道、历史路线图及截至10月20日的后续信息，新增结果主要重复9月发布口径。\n\n2026年9月22日，阿里在云栖大会宣布真武V900。阿里集团9月25日官方总结明确：这是一款训练与推理处理器，配备216 GB显存、1,200 GB/s芯片间带宽，原生支持FP8、FP4，性能为M890的三倍，**计划2027年第一季度量产并正式面向市场推出**。官方材料可证明发布及相关方承诺，规格和性能仍属厂商公布值，不能写成独立测评或已交付配置。[E01](#e01)[E02](#e02)\n\n“三倍”在已读官方原文中未注明计算精度、稀疏性、频率、峰值或实测、模型、批量、序列长度及软件版本，也没有绝对FLOPS值。FP8/FP4支持不能自动补足“三倍”的比较条件。1,200 GB/s明确指片间互联，不能写成显存带宽；单向或双向、单链路或聚合口径未明确。显存类型、显存带宽、功耗、板卡形态和接口也未在本轮取得的官方发布材料中说明。因此不能据这些数值推导相对英伟达或华为的综合性能排名。[E02](#e02)\n\n应区分三层对象：V900为芯片；V900与ICN Switch组成的超节点，在发布报道中被描述为具备原生内存语义、统一编址及“千卡全带宽高速互联”；搭载V900、ICN Switch、磐脉智能网卡和镇岳SSD控制器的升级服务器，再结合阿里云智算中心网络，宣称单一集群最多支持50万卡。[E02](#e02)[E03](#e03) **50万卡是集群扩展能力宣称；统一内存超节点的已读口径是千卡，50万卡规模未取得建成、交付或实测证据。** 千卡全带宽同样缺拓扑、链路配置、集合通信测试及扩展效率数据。官方9月25日文章能直接支持服务器组成及集群规模口径；内存语义、统一编址和千卡互联的进一步描述，来自现场媒体转述，尚未取得正式协议、规格手册或完整演讲录像进行核对。[E03](#e03)[E04](#e04)\n\n本轮回查发现，216 GB和“三倍”**并非9月首次披露**。5月20日，大河财立方记者陈薇在阿里云峰会现场稿中已记录这两个说法及“带宽达1200GB”，原计划2027年第三季度推出。该稿未写带宽的每秒单位，也未定义片间互联，不能据此认定9月1,200 GB/s口径已在5月完整披露；该稿也没有FP8/FP4说明。9月材料把量产销售目标写为2027年第一季度。因此可确认“公开时间表前移”，但5月“推出”和9月“量产销售”的阶段措辞不同，不能进一步认定实际研发或量产已提前完成。[E05](#e05)[E02](#e02)\n\n截至本轮，没有取得V900送样、客户验收、量产完成、实际出货或可订购云实例的原始证据。官方演讲中“规模化上架”和运行超2万亿参数模型的对象明确为**M890 AI超节点**，不能作为V900交付证明；“650家客户”属于真武芯片总体口径，也不能归给V900。[E01](#e01)[E02](#e02) 对能力的合理判断是：更大显存和更强互联可能缓解大模型切分和通信压力，但收益成立仍取决于软件、拓扑、实际带宽及业务负载。后续最有价值的证据是正式规格书、附条件性能测试、V900实例订购文档及客户侧交付记录。\n\n### 规格与阶段表\n\n| 对象／项目 | 可核对内容 | 状态与边界 |\n|---|---|---|\n| V900身份 | 训练与推理处理器；9月22日发布 | 发布事件有一手证据支持[E01](#e01)[E02](#e02) |\n| 显存 | 216 GB | 仅能确认相关方宣称；类型、带宽未知[E02](#e02) |\n| 片间互联 | 1,200 GB/s | 仅能确认相关方宣称；方向、链路／聚合范围未知；非显存带宽[E02](#e02) |\n| 低精度 | 原生支持FP8、FP4 | 仅能确认相关方宣称；未给对应绝对算力[E02](#e02) |\n| 相对性能 | M890的三倍 | 仅能确认相关方宣称；比较条件缺失[E01](#e01)[E02](#e02) |\n| ICN超节点 | 原生内存语义、统一编址、千卡全带宽 | 仅能确认相关方宣称；现场媒体转述，未取得协议及实测[E03](#e03)[E04](#e04) |\n| 升级服务器 | V900＋ICN Switch＋磐脉＋镇岳 | 官方发布组合；IT之家称磐久服务器计划2027Q1上市[E02](#e02)[E04](#e04) |\n| 单一集群 | 最多50万卡 | 官方能力宣称；未证实已建设、交付或实测[E01](#e01)[E02](#e02) |\n| V900量产销售 | 计划2027Q1 | 未来计划；当前实际量产、交付未知[E02](#e02) |\n| 历史路线图 | 5月已披露216 GB、三倍及“1200GB”数字（未写/s或互联定义），计划2027Q3推出 | 现场记者原稿记录厂商路线图[E05](#e05) |","unknowns":"| 候选 | 未解决问题 | 已尝试路径与后续有效材料 |\n| --- | --- | --- |\n| S01 | 三倍性能条件、带宽方向／聚合口径、ICN实测、当前送样交付及价格 | 已追官方发布、开发者文档、会议／视频、现场及英文报道、采购与云实例；需正式规格书、附配置测试与客户／云订购交付材料 |","evidence":"| 编号 | 支持范围 | 来源与原文链接 | 日期与定位 | 身份及局限 |\n| --- | --- | --- | --- | --- |\n| \u003ca id=\"e01\">\u003c/a>E01 | 正式发布、三倍、50万卡；M890上架归属 | [阿里CEO吴泳铭演讲全文](https://www.alibabagroup.com/zh-CN/document-2039431633571938304) | 发布／事件2026-09-22；“第二基石是AI芯片”，网页行51—57 | 官方原文已读；性能及规模为厂商宣称，M890段与V900段明确分开 |\n| \u003ca id=\"e02\">\u003c/a>E02 | 216 GB、1200 GB/s、FP8/FP4、2027Q1量产上市；服务器组成 | [阿里云2026云栖大会：全栈AI路线图及全球市场拓展计划](https://www.alibabagroup.com/zh-CN/document-2041268239081668608) | 发布2026-09-25；事件9月22—24日；“平头哥公布真武V900及倚天CPU路线图”，行31—35 | 新取得官方原文；没有性能测试条件或实际交付信息 |\n| \u003ca id=\"e03\">\u003c/a>E03 | 超节点内存语义、统一编址、千卡全带宽；集群50万卡边界 | [国际金融报／马云飞，经东方财富承载](https://finance.eastmoney.com/a/202609223881304714.html) | 2026-09-22 17:01；行65—70 | 具名现场报道，明确“平头哥称”；非独立测试 |\n| \u003ca id=\"e04\">\u003c/a>E04 | 磐久服务器2027Q1上市；当时对外服务对象为M890 | [IT之家／汪淼现场报道](https://www.ithome.com/1/005/602.htm) | 2026-09-22 11:18:56；行45—55，芯片与服务器段 | 原始现场媒体稿；未披露测试方法；配图链接实际返回占位图，未据图取数 |\n| \u003ca id=\"e05\">\u003c/a>E05 | 5月已有216 GB、三倍及“1200GB”数字；原计划2027Q3推出，带宽单位和定义不完整 | [大河财立方／陈薇文图](https://app.dahecube.com/nweb/news/20260520/274421nb469560f68e.htm) | 2026-05-20 12:56:30；事件同日；行14、25 | 原始现场报道，直接记录高慧发言；属于当时路线图 |","batch":"2026-10-20","time":"2026-10-20T09:45:00+08:00","reportId":"report-f3cc178d298e66a91c054a2dc84baa8e5bfdee984745cc309b1b3c6415c9f719","sequence":3,"sourceState":"available","testRun":false}]},{"id":"2026-10-20-S02","vendor":"壁仞科技","versions":[{"candidateId":"2026-10-20-S02","researchId":"2026-10-20-R02","vendor":"壁仞科技","title":"BR20X与新代验证","summary":"港交所10/8原公告确认未具名新代完成启动测试并进入流片后验证；未来数季送样量产附认证条件","observationNotes":"BR20X对应由媒体采访补强；BR20X/BR2xx精确映射、H200比较条件和实际送样量产日未证","body":"完成程度：**部分完成**。已取得点亮原公告、核清阶段及媒体口径；BR20X/BR2xx精确对应、性能条件、实际送样及量产日期仍缺公开证据。\n\n### 核验结论\n\n**10月8日公告确认的是未具名“新一代产品”完成启动测试、进入流片后验证，不能直接写成BR20X已量产。**港交所原公告第7页说明，客户送样和量产预计发生在未来数个季度，且须圆满完成验证及认证。公告没有给出点亮发生的具体日期，也未出现BR20X、BR2xx或H200型号。对“点亮及当前阶段”有一手披露支持；对已经送样、已通过客户认证或已量产，证据不足。[E07](#e07)\n\nBR20X是公司正式使用的型号：2025年12月招股书第220页将其列为基于第二代架构的下一代云端训推旗舰系列，规划原生FP8/FP4、更大更快内存及更高互连带宽，当时预计2026年商业上市。[E08](#e08) 公司8月3日发布的WAIC回顾则使用**BR2xx系列GPU**名称，介绍其Chiplet、FP8/FP4和基于BLink 2.0的16/128/1024卡方案。[E09](#e09) 两份材料在代际、用途及技术方向上相符，支持属于同一新代产品方向的推断，但本轮未取得公司明确解释两种名称一一对应、系列包含关系或具体SKU的文件；不能直接把BR2xx的所有系统规格填入BR20X单卡规格表。1024卡是厂商方案的扩展能力表述，本轮没有1024卡实机验证或交付证据。\n\n点亮信息也早于10月8日：时代财经白金蕾9月30日原文已经报道下一代GPU“近期已点亮”，并引述消息人士称性能超过H200，未披露测试方法。[E10](#e10) 10月8日北京商报报道明确称，记者从公司方面获悉BR20X点亮；但将H200比较另列为“另有消息称”。[E11](#e11) 这提高了点亮产品对应BR20X的可信度，同时保留其属于媒体采访转述的边界。\n\n**“对标／超过H200”尚不能形成可比较性能结论。**财联社10月8日文章使用“对标H200”，并写到2026年第四季度验证送测、2027年规模部署；这些内容不在所查配售原公告中。[E12](#e12) 第四波10月10日文章进一步将H200、第四季度送测归于星展研报，将2027年量产归于大和预测，并转述星展9月30日给出的H200约80%—120%性能范围。[E13](#e13) 本轮未获得该研报原件，亦未找到包含卡数、精度、模型、批量、序列长度、软件版本、功耗与测试方法的独立测试，故不采用80%—120%作为正式性能参数。“2027年第二季度起量”等精细日期也仅见媒体转述机构判断。[E11](#e11)\n\n供应准备已有公司资金投入披露，但不能据此判断产能全部锁定。公告第8页披露，截至9月30日，7月配售中专项用于下一代产品商业化与生产的资金已用约8.148亿港元；第7页同时将更新采购计划中的开支合并表述为“已承诺或计划”。[E07](#e07) 未公开供应商、采购合同、产能数量或取消条件，无法拆出具有约束力采购金额。其含义是公司在验证及客户适配认证期间提前备产，后续判断供给应看实际认证、送样、量产及客户验收披露。\n\n### 逐主张证据分级\n\n| 主张 | 判断 | 边界 |\n| --- | --- | --- |\n| 新一代产品完成启动测试进入流片后验证 | 有一手证据支持 | 公司10月8日披露，原公告未具名且无点亮具体日期；E07 |\n| 点亮产品为BR20X | 仅能确认相关方宣称 | 北京商报记者称从公司方面获悉；未取得具名型号的点亮原公告；E11 |\n| BR20X与BR2xx一一对应 | 证据不足 | 官方分别使用两种名称，技术方向相符；同代关联可推断，一一映射不可确定；E08、E09 |\n| 已送样、客户认证完成、已量产 | 证据不足 | [E07](#e07)仅为附条件未来计划 |\n| Q4验证送测／2027量产 | 仅能确认相关方宣称 | 媒体转述机构预期；未获研报原件或完成公告；E12、E13 |\n| 对标／超H200 | 仅能确认相关方宣称 | [E10](#e10)匿名消息、E11/[E12](#e12)媒体说法；实际相同性能结论证据不足 |\n| 1024卡方案扩展能力 | 仅能确认相关方宣称 | 官网方案，未取得实机验证或交付证据；E09 |\n| 已开展备产资金投入 | 有一手证据支持 | 公司披露专项资金已用；不能拆出约束采购金额或产能；E07 |\n\n### 阶段表\n\n| 时间 | 事项及可支持范围 | 状态 |\n| --- | --- | --- |\n| 2025-12-22 | 招股书：BR20X架构设计完成，正进行物理设计及流片验证；商业上市为2026年计划 | 公司披露的当时状态及计划；E08 |\n| 2026-07-17—20；官网8月3日回顾 | BR2xx及BLink 2.0超节点方案推出 | 有官方方案发布证据；不等于量产；E09 |\n| 2026-09-30 | 时代财经报道下一代GPU近期点亮、消息人士称超H200 | 媒体原始消息，缺测试条件；E10 |\n| 2026-10-08 | 公司公告：新一代产品完成启动测试、进入流片后验证 | 有一手披露；公告未具名；E07 |\n| 2026-10-08 | 北京商报称从公司方面确认BR20X点亮 | 可确认媒体采访转述；E11 |\n| 未来数季 | 客户送样及量产，取决于验证及认证完成 | 公司计划，未证实已发生；E07 |\n| 2026Q4／2027 | 验证送测／规模部署或量产 | 媒体及机构预期，未获研报原件或实际完成披露；E12、E13 |\n| 官网2026-10-10；活动9月18—19日 | 基于BR20X开发环境的SUPA黑客松 | 官方活动证据；未披露实物卡配置，不足以反推客户送样；E14 |","unknowns":"| 候选 | 未解决问题 | 已尝试路径与后续有效材料 |\n| --- | --- | --- |\n| S02 | BR20X与BR2xx精确关系、H200性能条件、客户认证和量产实际日期、约束采购额 | 已追港交所原公告、招股书、官网、最早消息、券商来源及10月后续；需命名说明、研报原件与测试、客户认证及实际量产披露 |","evidence":"| 编号 | 原文链接、主体与日期 | 定位与支持范围 | 局限 |\n| --- | --- | --- | --- |\n| \u003ca id=\"e07\">\u003c/a>E07 | [港交所：根据一般授权配售新H股](https://www.hkexnews.hk/listedco/listconews/sehk/2026/1008/2026100800060_c.pdf)，壁仞科技，2026-10-08 | 印刷第7页“进行配售的理由及所得款项用途”(i)、(ii)及后续段；第8页(i)；第9页资金用途表。点亮、启动测试、验证阶段、附条件未来送样量产、已投入资金及采购准备 | 官方披露支持到相应阶段；全文未见BR20X、BR2xx、H200；“已承诺或计划”不能拆出约束采购额 |\n| \u003ca id=\"e08\">\u003c 复本所载项目编号为 **QHJY-FZB-2026-001**，预算625,894,760元，其中原包一174,080,000元、原包二451,814,760元；两包。公告记载采购公告日期9月16日、评标及定标日期均9月23日。原包一由上海壁仞科技股份有限公司中标，金额174,000,000元，比该包预算少80,000元，得分89.71，排序第一；原包二因递交响应文件的供应商不足三家废标。[E21](#e21) **有一手证据支持的范围限媒体所附结果公告复本的文字**，原站发布及复本完整性尚未独立核验，不能把媒体报道和相同公告图像累计为多个独立确认。\n\n交货条件的完整口径是“自合同签订完成后按合同约定支付相关金额，45个日历日内完成供货”。它是附条件的履约要求，缺合同日期和付款事实，不能从9月23日直接推算实际到货日期，也不能把公告当签约、交付或验收证明。[E21](#e21) 首轮复本的“各包要求”仅称详见技术参数；本轮未取得该参数文件。媒体称产品线为壁砺GPU，但未给可分离采购清单，**型号、卡数、服务器数量、软硬件及服务范围、含税性质均证据不足**。不得把1.74亿元除以推测卡数得单卡价格，也不能从其他壁砺案例反填BR166或BR20X。[E22](#e22)\n\n9月29日结果应作为同项目后续批次处理。9月24日公开平台公告显示预算451,814,760元、六包，金额与首轮废标包二一致；各包采购范围仍指向未附的技术参数。[E23](#e23) 9月30日芯东西记者陈骏达原稿明确称原包二拆为六包重新询比，新包一为中诚华隆1.8亿元、新包二为紫光数码约1.72亿元。[E24](#e24) 必联网9月29日结果公告转载可读到六家供应商，并存在结果预算452,640,760元、新包一预算180,826,000元与9月24日预算的差异；其项目编号被遮蔽，另有聚合索引给出QHJY-FZB-2026-005，但正文定位失败，**该编号仅为线索，不能当已核原件**。[E25](#e25) 因此不能把后轮“包一”当首轮壁仞包一的重授，也不能把预算差异无说明地抹平。拆包关系得到公开公告结构和署名媒体说明支持，原始更正文件仍缺。\n\n本次补查采购方全称、项目名＋合同／验收／交付、供应商官网及公告编号，没有取得壁仞此项目已签约、已交付或验收的客户／公司原件。后续报道中的“订单”与“交付能力”评价不能补足这些事实。项目可支持的商业判断停在中标公告复本所载阶段；不能据此认定收入、实际算力上线、供应链稀缺或客户使用率。继续推进最需要公开技术清单、签署合同、付款与到货记录、验收书，以及9月24日至29日预算变更公告。\n\n### 项目批次核对\n\n| 批次 | 编号／采购范围 | 结果及边界 |\n| --- | --- | --- |\n| 9/16采购、9/23评定标 | QHJY-FZB-2026-001；两包；总预算625,894,760元 | 原包一壁仞174,000,000元；原包二废标；媒体附载公告复本，原站未取[E21](#e21) |\n| 9/24重新采购 | 正文未见编号；六包；预算451,814,760元 | 包一180,000,000；包二172,441,024；包三43,348,069；包四22,447,300；包五5,167,423；包六28,410,944元；技术参数未公开取得[E23](#e23) |\n| 9/29后续结果 | 索引称QHJY-FZB-2026-005，未核原件；六包 | 新包一中诚华隆180,000,000元，新包二紫光数码172,423,680元；结果预算452,640,760元，与9/24有826,000元差异，未找到更正解释[E24](#e24)[E25](#e25) |","unknowns":"| 候选 | 未解决问题 | 已尝试路径与后续有效材料 |\n| --- | --- | --- |\n| S03 | 原始结果页、参数清单及型号数量、合同付款／到货／验收、后轮预算变更 | 已追原平台、编号标题、公告影像、其他公开招采平台、公司及客户全称；需公开合同、技术附件、验收文件和更正公告 |","evidence":"| 证据 | 支持内容 | 原文及定位 | 日期、身份与局限 |\n| --- | --- | --- | --- |\n| \u003ca id=\"e21\">\u003c/a>E21 | 首轮编号、两包预算、中标金额、评分、日期及45日条件 | [结果公告图像](https://www.esmchina.com/d/file/news/2026-09-28/e355b089be2af7eaa9aecd7f1e19dd66.png)，完整可见图像，项目编号至 view.html)。 | **部分完成**：身份与软件边界已核，实际点亮地点、验收、报价及系统实测未核。 |\n| 2026-10-20-03-R02／S04 | 摩尔线程已有SGLang通用MUSA接入和安装原件；Step 5专用适配目前主要由产品技术稿描述，尚未形成可核的“具体版本／镜像＋配置＋量化结果”闭环。[SGLang安装PR](https://github.com/sgl-project/sglang/pull/36709)、[DOIT技术稿](https://www.doit.com.cn/ai/859904890085445.html)。 | **部分完成**：通用软件可用路径已核，模型专用交付物与性能未核。 |\n| 2026-10-20-03-R03／S05 | **初筛的状态冲突已解决：PR #199确于10月15日合入**，主线也能读取SUPA适配文件；初筛取得的是旧页面。代码合入不能等同正式版本、真实训练验证或客户交付。[GitHub原始接口](https://api.github.com/repos/flagos-ai/Megatron-LM-FL/pulls/199)、[合并提交](https://github.com/flagos-ai/Megatron-LM-FL/commit/bbc208e00f2a201783938ef549f5058d6047e4c0)。 | **部分完成**：合入争议核验完成，发布版本及端到端硬件训练能力仍缺证据。 |\n\n## 二、逐候选事实与分析\n\n### R01：华为1024卡Atlas 950 SuperPoD与Step 5 Preview\n\n**产品身份与时间线。** 华为2026年7月17日WAIC原文已称首次线下展出1024卡Atlas 950真机，并披露1 EFLOPS FP8、2 EFLOPS FP4、256TB统一编址及3μs RTT。因此这些规模与规格不是10月15日首次出现；7月展示地点上海也不能自动认定为10月点亮地点。[华为官方发布，2026-07-17，“真机首次亮相”部分](https://www.huawei.com/cn/news/2026/7/atlas-950-superpod)。\n\n10月15日具名媒体报道首套1024卡液冷超节点随Step 5权重开源同步上线点亮；这是媒体转述的运行事件。本轮仍未取得对应地点、客户身份和验收原件，不能将“点亮”升级为正式验收、批量交付或可订购云服务。[IT之家／问舟，2026-10-15 22:07](https://m.ithome.com/html/1013663.htm)。\n\n**规格可核，但配置不能拼接。** 当前官方产品页给出下列1024卡配置上限，属于厂商规格，非本轮实测或某客户实装清单。\n\n| 对象 | 官方页面口径及解释 | 来源 |\n| --- | --- | --- |\n| 系统及芯片 | 16个计算柜＋4个互联柜；最多1024颗昇腾950DT、256颗鲲鹏950；计算柜和互联柜均液冷。 | [昇腾官方产品页，“技术规格”](https://www.hiascend.com/hardware/cluster) |\n| 算力与内存 | 最大1 EFLOPS mxFP8／FP8／HiF8、2 EFLOPS mxFP4；页面另列1024×96GB片上内存。256TB是全局统一编址口径，不能直接写成等量HBM或单任务可用显存。 | [昇腾官方产品页，“产品特性／技术规格”](https://www.hiascend.com/hardware/cluster) |\n| 互联及供电 | 单柜互联最大64×1.68TB/s（双向）；页面有“100kW供电”表述，但未在该处明确整套20柜边界，不能作为系统总功耗测值或直接计算运行成本。 | [昇腾官方产品页](https://www.hiascend.com/hardware/cluster) |\n\n华为3月2日另一篇Atlas 950材料则介绍单柜64卡、最大8192卡互联。不同时间材料的系列名称相同，并不证明与本次1024卡配置完全等同；不能把8192卡上限、1024卡规格和实际点亮数量混写成一套已交付产品。[华为MWC原文，2026-03-02](https://www.huawei.com/cn/news/2026/3/mwc-superpod-ai)。\n\n**模型软件的进展与限制。** vLLM Ascend公开指南限定950DT，使用Step-5-Preview-w8a8-mxfp8权重和专用镜像`quay.io/ascend/vllm-ascend:step5-a5-openeuler`，列出HDK 25.5.0、CANN 9.2.0、torch_npu 2.10.0.post4及基于v0.27.0的框架组合；当下不支持该模型的源码安装。[项目指南，§1、§3、§4](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Step-5-Preview.html)。\n\n指南展示双节点TP4、DP4、每节点DP2及MTP参数，提供精度结果；性能章节没有1024卡吞吐或时延测值，且明确性能优化与服务可靠性验证仍在进行、不建议直接用于生产。双节点示例不能充当整套1024卡系统的测试报告。[项目指南，§5、§7—9](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Step-5-Preview.html)。\n\n部署文档PR #18774已于10月15日16:20:02（北京时间）合并，但PR说明此次为文档更新。**文档合入与模型支持代码完整合入是不同状态**，前者不推翻指南对源码安装的限制。[PR原文](https://github.com/vllm-project/vllm-ascend/pull/18774)、[GitHub接口中的合并时间](https://api.github.com/repos/vllm-project/vllm-ascend/pulls/18774)。\n\n**竞争含义。** 证据支持从硬件展示进一步走向具体前沿模型的可体验部署，这是有价值的工程进展。是否已成为稳定、可采购且有成本优势的生产系统，仍取决于整机验收、负载实测和服务供给。现有资料不足以确认“性能持平海外先进算力”，也不支持计算单卡价格、tokens成本或市场份额。\n\n### R02：摩尔线程MTT S5000／MUSA的Step 5适配\n\n**模型能力与硬件能力分开核。** StepFun官方仓库描述Step 5为600B总参数、27B激活、最高1M上下文的多模态模型；这些是模型属性，不等于在S5000上已验证全部上下文、模态和并发组合。[StepFun模型仓库，“Introduction／Deployment”](https://github.com/stepfun-ai/Step-5-Preview)。摩尔线程S5000官方产品页确认硬件原生FP8支持；其其他训练宣传不能替代Step 5推理测评。[S5000官方页，“FP8原生算力”](https://mthreads.com/product/S5000)。\n\n**本次适配实际宣布了什么。** 10月15日DOIT技术稿称S5000及MUSA完成Day-0适配，具体包括：\n\n- SGLang-MUSA下的混合滑窗／稀疏注意力、TP8／EP8切分；\n- FP8 DeepGEMM以及BF16／FP32混合精度路径；\n- Decode专家派发优化、MTP3、Vision Encoder与Projector接入。\n\n这些属于媒体承载的产品技术介绍，本轮没有取得同一实验的代码提交、镜像摘要或完整测试日志，不能写为独立复验结果。[DOIT，2026-10-15，“全链路适配与调优”各小节](https://www.doit.com.cn/ai/859904890085445.html)。TP8／EP8是其描述的并行设置，不足以补齐服务器、互联、权重、batch及上下文等测试配置；MTP3也不等于实际速度提升四倍。\n\n**公开软件基础可以确认。** SGLang MUSA路线图的维护者早在1月29日就说明已能用MUSA运行单卡／多卡，并列出持续演进的内核、运行时和CI工作。因此10月这次新增是具体模型适配，不能称首次实现SGLang支持。[SGLang Issue #16565，维护者2026-01-29评论](https://github.com/sgl-project/sglang/issues/16565)。\n\n安装PR #36709于9月7日合并，内容包括MUSA Dockerfile、安装说明与依赖配置；该PR明确限定为安装支持，运行时能力另行跟踪。其文档通过Moore Threads软件源安装MUSA依赖并构建镜像，验证示例是Qwen3-8B，**不是Step 5专用交付或测试**。[安装PR](https://github.com/sgl-project/sglang/pull/36709)、[项目接口中的文档变更](https://api.github.com/repos/sgl-project/sglang/pulls/36709/files)。\n\n**模型专用可用性仍有缺口。** 当前SGLang的Step 5专用cookbook称支持尚未进入正式SGLang release，使用预览镜像`lmsysorg/sglang:step-5-preview`，验证矩阵为B300／H200。这不能当作S5000镜像或命令直接复用；也不能反向断言厂商适配不存在。[SGLang原始cookbook，“Deployment／Per-platform notes”](https://github.com/sgl-project/sglang/blob/main/docs/cookbook/autoregressive/StepFun/Step-5-Preview.mdx)。厂商SGLang-MUSA介绍及发行说明本轮未取到正文，其搜索摘要不用于确认Step 5版本。\n\n**竞争含义。** 原生软件生态已有基础，模型稿也提供了具体优化方向，说明调查价值高于一句泛化的“适配完成”。但当前证据尚不能证明用户可从一个公开固定版本复现全部宣布功能，更不足以支持吞吐领先、低成本或生产稳定性的判断。尚缺同配置下的tokens/s、TTFT／TPOT、长上下文实测长度、MTP接受率及长时间运行记录。\n\n### R03：壁仞SUPA接入Megatron-LM-FL\n\n**状态冲突已解决，保留初筛记录并追加更正。** 本轮重新读取原始PR及GitHub接口，确认PR #199为`merged=true`，合并时间为2026年10月15日11:05:13 UTC，即北京时间**19:05:13**，合并提交为`bbc208e00f2a201783938ef549f5058d6047e4c0`。初筛旧页显示Open，不能据此继续判断未合入；第三方汇总的合入日期已获原始记录支持。[GitHub PR #199](https://github.com/flagos-ai/Megatron-LM-FL/pull/199)、[原始接口](https://api.github.com/repos/flagos-ai/Megatron-LM-FL/pulls/199)。\n\n**合入范围比“完整训练栈就绪”窄。** 实际合并提交修改3个文件：平台注册、SUPA平台适配、平台测试，共新增371行／删除4行。PR描述提及的其他文件不应当作最终实际改动清单。SUPA采用独立的torch设备类型，兼容层将CUDA调用导向SUPA，通信后端为BCCL；这些是设备和运行时接口接入。[最终合并提交及文件列表](https://github.com/flagos-ai/Megatron-LM-FL/commit/bbc208e00f2a201783938ef549f5058d6047e4c0)、[原始文件变更接口](https://api.github.com/repos/flagos-ai/Megatron-LM-FL/pulls/199/files)。\n\n本轮亦从main读取到`platform_supa.py`，确认适配已存在于主线。文件实现设备、内存、流及图执行接口，同时`is_triton_supported()`返回False，编译后端和若干监测接口仍有空实现。这只说明**该适配层的当前支持范围**，不能推为壁仞全软件栈没有Triton或编译能力。[主线原文件](https://github.com/flagos-ai/Megatron-LM-FL/blob/main/megatron/plugin/platform/platform_supa.py)、[GitHub内容接口](https://api.github.com/repos/flagos-ai/Megatron-LM-FL/contents/megatron/plugin/platform/platform_supa.py?ref=main)。\n\n**测试与版本需要继续分层。** 新增测试包含模拟后端和设备契约测试；PR页面的跨平台检查数量不能代替指定壁仞卡上真实多卡训练的通过证明。本轮没有取得型号、模型、卡数、loss曲线、吞吐及稳定性组成的端到端验证记录。[最终测试改动](https://github.com/flagos-ai/Megatron-LM-FL/pulls/199/files)。\n\n读取到的项目发布列表最新条目为9月28日v0.3.0；版本与此次合并提交的比较显示分支有分歧，不能将当前main的SUPA功能视为该标签已经包含。现阶段可确认的是主线代码可读，尚未确认承载此次支持的正式发布标签或可交付镜像。[发布列表接口](https://api.github.com/repos/flagos-ai/Megatron-LM-FL/releases?per_page=5)、[v0.3.0与合并提交的比较](https://api.github.com/repos/flagos-ai/Megatron-LM-FL/compare/v0.3.0...bbc208e00f2a201783938ef549f5058d6047e4c0)。\n\n**竞争含义。** 这是FlagOS的Megatron-LM-FL项目接入，不能扩大成NVIDIA上游Megatron-Core已原生支持壁仞，也不代表某型号已量产交付。可确认的增量是平台正式进入该项目主线；真实训练覆盖和产品交付成熟度，需要硬件验证与正式软件发布继续补足。\n\n## 三、未解决问题\n\n| 候选 | 影响判断的未知 | 能推进核验的材料 |\n| --- | --- | --- |\n| S01／R01 | 10月点亮的具体地点及运营／客户主体；与7月展出机器的关系；正式验收、供货和报价；1024卡下同条件吞吐、时延、故障恢复及总功耗。 | 具体项目的客户／厂商原始运行公告、配置及验收文件、正式报价；含模型、精度、长度、并发和测量方法的系统测试报告。 |\n| S04／R02 | Step 5专用MUSA提交、固定版本和镜像；实际服务器与卡数；1M上下文、模态和并发的已验证范围；量化精度与长期稳定性。 | 厂商发布说明和镜像digest、完整启动配置、可核社区PR／提交；精度与吞吐日志、MTP开关对照及稳定性记录。 |\n| S05／R03 | 承载SUPA接入的正式标签／镜像；适用GPU、torch_supa／BCCL版本；真实模型和多卡训练验证，以及当前适配层限制。 | 包含合并提交的版本清单、依赖与环境矩阵；指定壁仞硬件上的训练日志、CI记录、loss和吞吐／稳定性测试。 |\n\n三项均已按所选问题开展公开资料研究，以上关键未知保留为**部分完成**。未取得材料不等于事件不存在；本轮没有把发布、合入或模型跑通推定为客户验收、销量和收入。\n","references":{"../../初筛/2026-10-20-03/筛选报告.md":"screen-4014e144fbfa8ccf3f789a2dce1d4339ec90526ad5dddf1f74d3c897b4d3a2a6"},"filename":"深挖报告.md","sourceUrl":"file:///Users/fch/Desktop/4%20MetaX%20%E5%AE%9E%E4%B9%A0/MetaX_%E5%B7%A5%E5%85%B7%E9%9B%86/%E5%B8%82%E5%9C%BA%E6%B4%9E%E5%AF%9FSKILL%20/AI%E8%8A%AF%E7%89%87%E7%AB%9E%E5%AF%B9%E8%B0%83%E7%A0%94Skill%E7%BB%84%E5%90%88/%E6%88%90%E6%9E%9C/%E6%B7%B1%E6%8C%96/2026-10-20-03/%E6%B7%B1%E6%8C%96%E6%8A%A5%E5%91%8A.md","sourcePath":"AI芯片竞对调研Skill组合/成果/深挖/2026-10-20-03/深挖报告.md","sourceState":"available","batch":"2026-10-20-03","screenId":"screen-4014e144fbfa8ccf3f789a2dce1d4339ec90526ad5dddf1f74d3c897b4d3a2a6"},"report-a6656a9e37b71493a4eeef012fdddf10f8b6b89622889c986bba4da7557c82d4":{"id":"report-a6656a9e37b71493a4eeef012fdddf10f8b6b89622889c986bba4da7557c82d4","markdown":"# AI芯片竞对深挖报告\n\n## 1. 结论概览\n\n批次：2026-10-20-02；检索截止2026-10-20 11:13:45（Asia/Shanghai）。按用户选择，仅研究2026-10-20-02-S01、S04、S05，范围为规格与性能条件、产品阶段、供货价格及客户运营、验收和收入。来源为[本轮筛选报告](../../初筛/2026-10-20-02/筛选报告.md)；复用本轮原文，不采用历史测试结论。必要背景追溯至窗口之前。\n\n| 候选／研究编号 | 核心结论 | 完成程度 |\n| --- | --- | --- |\n| 2026-10-20-02-S01／2026-10-20-02-R01 | V900发布规格和2027年Q1量产商业发布计划已有阿里集团原文支持；当前不能据此认定已量产或交付。[阿里集团，2026-09-25，“New silicon from T-Head”](https://www.alibabagroup.com/en-US/document-2041268239081668608) | **部分完成**：性能可比条件、实际供货和价格仍未知。 |\n| 2026-10-20-02-S04／2026-10-20-02-R02 | 公告确认“新一代产品”完成启动测试、进入流片后验证；未来送样量产有验证认证前提。[10月8日公告PDF复本，第7页](https://www.sl886.com/track/index?id=4546351&type=hkexnews) | **部分完成**：阶段已核；公告未直接点名BR20X，后续实际送样量产无可核证据。 |\n| 2026-10-20-02-S05／2026-10-20-02-R03 | 一期2000卡S5000已运行、基本满载的报道在9月2日即存在；10月16日官网条目不能作为首次满载日期。[新京报转载，2026-09-02](https://www.bjnews.com.cn/detail/1788335834129757.html) | **部分完成**：卡型与早期时间线有依据；验收、付费利用率、项目收入未核实。 |\n\n## 2. 逐候选事实与分析\n\n### R01｜平头哥真武V900与磐久系统\n\n**规格与性能。** 阿里集团9月25日原文将V900定义为训练与推理处理器，公布216GB显存、1200GB/s片间互联及原生FP8/FP4支持，宣称性能为M890三倍。该段没有提供绝对FLOPS、稠密／稀疏口径、模型、批量、序列长度、软件版本和测量方法；显存类型、显存带宽、功耗、互联单双向口径也未列出。[阿里集团，2026-09-25，“New silicon from T-Head”](https://www.alibabagroup.com/en-US/document-2041268239081668608)\n\n因此，“三倍”可以记录为厂商相对前代的宣称，不能换算成与其他厂商卡型的普遍领先幅度。本轮未取得独立实测或可复现基准；不采用社区文章中的推测制程、功耗和互相冲突的显存配置。\n\n**系统关系。** 集团原文称升级超节点服务器集成V900、ICN Switch、磐脉SmartNIC及镇岳SSD控制芯片，并给出最高50万卡的集群扩展目标。这是系统层面的架构容量描述，不能读成单台服务器50万卡或已建成50万卡客户集群。[阿里集团，2026-09-25，同节](https://www.alibabagroup.com/en-US/document-2041268239081668608) 9月22日汪淼的现场报道将该服务器称为“全新磐久超节点服务器”，上市时间为2027年Q1；这是记者现场记录，非独立性能测试。[IT之家，2026-09-22 11:18，正文](https://m.ithome.com/html/1005602.htm)\n\n**供货与价格。** 集团原文使用“scheduled”表述2027年Q1量产和商业发布，仍属未来计划。现场稿中的“已对外提供服务”对应M890的GP9A实例，不能移植为V900供货证明；该区分仅用于解释本选题，不另研究GP9A。[阿里集团，2026-09-25](https://www.alibabagroup.com/en-US/document-2041268239081668608)，[IT之家，2026-09-22](https://m.ithome.com/html/1005602.htm) 本轮未取得截至检索截止的V900实际交付文件、可购买配置、公开报价或可分离的采购成交记录，价格留空。\n\n**对判断的影响。** 当前能确认的是新品发布口径和系统产品计划。显存容量、互联及低精度支持值得继续关注，但能否改善目标模型吞吐、成本和交付能力，需要实际配置、基准及客户材料才能判断。\n\n### R02｜壁仞BR20X点亮与商业化阶段\n\n**公告核读与身份。** 本轮取得《根据一般授权配售新H股》14页PDF复本，文末署期2026年10月8日；通过SL886公告链接读取，未将其冒称港交所原站直接访问。第7页明确写新一代产品已完成启动测试、进入流片后验证；未来数季度客户送样及量产“惟须待圆满完成验证及认证后方可作实”。[公司公告PDF复本，2026-10-08，第7页](https://www.sl886.com/track/index?id=4546351&type=hkexnews)\n\n该段使用“新一代产品”，并未直接列BR20X型号。第一阶段已读的集邦咨询及具名原创报道将其指认为BR20X，型号对应仍按媒体指认保留，不能把公告读成已明确给出型号和详细规格。[集邦咨询，2026-10-08，正文](https://www.trendforce.cn/industry-news/semiconductors/20261008-8382.html)，[IPO早知道，2026-10-08，搜狐承载](https://www.sohu.com/a/1085077478_100171209)\n\n**阶段边界。** 公告第7页还说明，供应链采购和生产准备需要与验证、客户适配认证并行。这支持“已经进入验证且提前备货”的判断；没有证明客户认证完成、送样已发生、量产良率达标或已规模交付。未给明确量产季度，不能把“未来数季度”补写为确定的2027年某季度。[公司公告PDF复本，2026-10-08，第7页](https://www.sl886.com/track/index?id=4546351&type=hkexnews)\n\n**解决配售日期冲突。** 10月8日公告是有条件配售协议；随后《完成根据一般授权配售新H股及修订公司章程》公告明确交割发生于10月12日。两份PDF能够纠正10月8日媒体所写“已完成配售”的时间口径。[10月8日公告PDF复本，第1—2页](https://www.sl886.com/track/index?id=4546351&type=hkexnews)，[10月12日完成公告PDF复本，第1页](https://www.sl886.com/track/index?id=4548295&type=hkexnews) 融资交割与产品量产是独立事件，前者不能替代后者的证据。\n\n**对判断的影响。** 点亮后验证是实质阶段进展，同时意味着仍有认证与生产爬坡风险。现阶段最有判断价值的是下一次明确送样、认证或量产公告；匿名“超过H200”说法缺测试条件，本轮不采纳。\n\n### R03｜摩尔线程无锡（惠山）智算中心一期\n\n**卡型、规模与主体。** 惠山区政府7月24日正文称一期基于MTT S5000、采用夸娥集群系统，已部署“超2000张”；新京报9月2日承载的企业资讯转载称一期2000张S5000全部运行，投资建设方为无锡移动惠山分公司，摩尔线程提供GPU、集群系统和软件栈。“2000／超2000”保留各自来源口径，不人为统一精确值。[惠山区政府，2026-07-24，“千P级算力底座”](https://www.huishan.gov.cn/doc/2026/07/24/4809561.shtml)，[新京报转载，2026-09-02，正文](https://www.bjnews.com.cn/detail/1788335834129757.html)\n\n“万卡级”不能直接当作一期已装1万卡：上述转载明确一期2000卡是起步，后续向万卡规模推进。区政府文中尚航基地近1.6万张卡也是另一统计对象，不应计入本项目一期。[新京报转载，2026-09-02，后续建设段](https://www.bjnews.com.cn/detail/1788335834129757.html)，[惠山区政府，2026-07-24](https://www.huishan.gov.cn/doc/2026/07/24/4809561.shtml)\n\n**时间线与满载口径。** 政协无锡网6月14日正文记载，在6月11日活动上智算中心一期正式点亮。[政协无锡网，2026-06-14，活动段](https://zx.wuxi.gov.cn/doc/2026/06/14/4790732.shtml) 9月1日媒体正文将机房走访定在8月25日，称一期2000张S5000全部投运、基本满载；9月2日转载进一步引述无锡移动惠山分公司总经理包彦成，称需求持续增长、基本达到满载。因此至少到8月下旬已出现满载说法，并非10月首次发生。[新浪财经，2026-09-01，机房走访段](https://finance.sina.com.cn/roll/2026-09-01/doc-iniqiaty1629977.shtml)，[新京报转载，2026-09-02，包彦成表述](https://www.bjnews.com.cn/detail/1788335834129757.html)\n\n“基本满载”仍是需求与运营表述，材料没有给测量周期、GPU利用率、可计费卡时、付费客户比例或收入对应关系，不能解释成100%付费利用率。10月16日官网仅标题与日期可见，本轮未重复追取已受限正文。[摩尔线程官方条目，2026-10-16，标题日期可见](https://mthreads.com/news/353)\n\n**客户、验收与收入。** 9月2日转载引述运营方：20多家客户在测试或正式使用，不能全部计作付费客户；文中具名转述南京邮电大学孙洪波团队与惠山区人民医院项目调用算力，但不附采购或验收文件。[新京报转载，2026-09-02，运营及医疗段；页面注明来源日照新闻网](https://www.bjnews.com.cn/detail/1788335834129757.html) 9月29日无锡日报稿列举招商、医疗、教育及芯片设计智能体，属于应用进展报道，可用于识别场景，不能替代这些客户的合同和付费确认。[无锡日报，2026-09-29，新浪承载正文](https://finance.sina.com.cn/roll/2026-09-29/doc-initnwnf2860674.shtml)\n\n本轮未取得项目硬件采购明细、正式验收报告、收费合同、到账或分项目收入披露。运行报道支持“已投运”的公开说法，但不能据此确认采购方验收、摩尔线程该项目收入金额或收入确认期间。也不能用公司总营收填充这一缺口。\n\n## 3. 未解决问题\n\n- **R01／部分完成：** 需要带精度、稠密性、功耗和任务条件的V900正式规格／基准，及截至实际供货时的配置、合同或报价。现有“三倍”与扩展上限不足以进行跨厂商性能或成本排名；未检出交付并不证明交付不存在。\n- **R02／部分完成：** 需要公司直接点名BR20X的对应文件，以及后续送样、客户认证、良率和量产披露。两份配售公告均通过第三方入口取得PDF复本，原站文件一致性未单独核对；原文阶段边界已保留。\n- **R03／部分完成：** 需要运营方的负载定义、监控期间与付费卡时；项目验收及合同、发票／回款或分项目收入披露。媒体中的20多家使用者和六类应用尚不足以量化收入，客户自行发布的验收证明未取得。\n\n上述未知已在合理核查后收束，本轮不继续扩展选题。\n","references":{"../../初筛/2026-10-20-02/筛选报告.md":"screen-50c8525b6b559f9c28fd5ba0af815e8002d6df53747be450b0b3adfe9e62c91b"},"filename":"深挖报告.md","sourceUrl":"file:///Users/fch/Desktop/4%20MetaX%20%E5%AE%9E%E4%B9%A0/MetaX_%E5%B7%A5%E5%85%B7%E9%9B%86/%E5%B8%82%E5%9C%BA%E6%B4%9E%E5%AF%9FSKILL%20/AI%E8%8A%AF%E7%89%87%E7%AB%9E%E5%AF%B9%E8%B0%83%E7%A0%94Skill%E7%BB%84%E5%90%88/%E6%88%90%E6%9E%9C/%E6%B7%B1%E6%8C%96/2026-10-20-02/%E6%B7%B1%E6%8C%96%E6%8A%A5%E5%91%8A.md","sourcePath":"AI芯片竞对调研Skill组合/成果/深挖/2026-10-20-02/深挖报告.md","sourceState":"available","batch":"2026-10-20-02","screenId":"screen-50c8525b6b559f9c28fd5ba0af815e8002d6df53747be450b0b3adfe9e62c91b"},"report-f3cc178d298e66a91c054a2dc84baa8e5bfdee984745cc309b1b3c6415c9f719":{"id":"report-f3cc178d298e66a91c054a2dc84baa8e5bfdee984745cc309b1b3c6415c9f719","markdown":"# AI芯片竞对线索深挖报告\n\n## 1. 结论概览\n\n研究批次：2026-10-20。研究截止：2026-10-20 09:45（Asia/Shanghai）；之后动态不在本轮核验范围内。来源：[本轮筛选报告](../../初筛/2026-10-20/筛选报告.md)。按用户最新缩小范围，仅研究前三项主要推荐S01—S03；S04—S07及观察项均未展开研究。研究从零执行，没有读取或复用旧测试、旧报告。正式Skill及压缩包只读。\n\n| 研究编号 | 候选编号 | 关键结论 | 证据边界与完成程度 |\n| --- | --- | --- | --- |\n| 2026-10-20-R01 | 2026-10-20-S01 | V900正式发布，官方公布216GB、1,200GB/s片间带宽、FP8/FP4，2027Q1量产销售为计划；50万卡属于集群能力宣称 | **部分完成**：三倍性能条件、ICN实测和实际交付未证；部分规格数字5月已有披露，9月计划较5月前移 |\n| 2026-10-20-R02 | 2026-10-20-S02 | 港交所10/8原公告确认未具名新代完成启动测试并进入流片后验证；未来数季送样量产附认证条件 | **部分完成**：BR20X对应由媒体采访补强；BR20X/BR2xx精确映射、H200比较条件和实际送样量产日未证 |\n| 2026-10-20-R03 | 2026-10-20-S03 | 首轮公告复本所载壁仞中标原包一1.74亿元；9/29新包一属于原包二拆分后的后续批次 | **部分完成**：原站结果页、参数清单、税费、型号数量、合同交付验收未取得；后轮预算差异保留 |\n\n“部分完成”指已合理追溯可用公开路径后，用户核心问题仍有关键证据缺口；不意味着达到数量上限。发布、点亮披露、中标、计划和实际交付分别判断。三项均没有取得可复核的独立性能测试，亦不能由中标或未来计划确认交付及收入。\n\n## 2. 逐候选研究\n\n## 2026-10-20-R01｜真武V900（2026-10-20-S01）\n\n**完成程度：部分完成。** 发布事件、厂商公布的规格及量产上市计划已有原始官方材料支持；“三倍”性能条件、ICN实测规模及V900实际交付仍缺关键证据。已合理追查官方新闻、开发者入口、现场报道、历史路线图及截至10月20日的后续信息，新增结果主要重复9月发布口径。\n\n2026年9月22日，阿里在云栖大会宣布真武V900。阿里集团9月25日官方总结明确：这是一款训练与推理处理器，配备216 GB显存、1,200 GB/s芯片间带宽，原生支持FP8、FP4，性能为M890的三倍，**计划2027年第一季度量产并正式面向市场推出**。官方材料可证明发布及相关方承诺，规格和性能仍属厂商公布值，不能写成独立测评或已交付配置。[E01](#e01)[E02](#e02)\n\n“三倍”在已读官方原文中未注明计算精度、稀疏性、频率、峰值或实测、模型、批量、序列长度及软件版本，也没有绝对FLOPS值。FP8/FP4支持不能自动补足“三倍”的比较条件。1,200 GB/s明确指片间互联，不能写成显存带宽；单向或双向、单链路或聚合口径未明确。显存类型、显存带宽、功耗、板卡形态和接口也未在本轮取得的官方发布材料中说明。因此不能据这些数值推导相对英伟达或华为的综合性能排名。[E02](#e02)\n\n应区分三层对象：V900为芯片；V900与ICN Switch组成的超节点，在发布报道中被描述为具备原生内存语义、统一编址及“千卡全带宽高速互联”；搭载V900、ICN Switch、磐脉智能网卡和镇岳SSD控制器的升级服务器，再结合阿里云智算中心网络，宣称单一集群最多支持50万卡。[E02](#e02)[E03](#e03) **50万卡是集群扩展能力宣称；统一内存超节点的已读口径是千卡，50万卡规模未取得建成、交付或实测证据。** 千卡全带宽同样缺拓扑、链路配置、集合通信测试及扩展效率数据。官方9月25日文章能直接支持服务器组成及集群规模口径；内存语义、统一编址和千卡互联的进一步描述，来自现场媒体转述，尚未取得正式协议、规格手册或完整演讲录像进行核对。[E03](#e03)[E04](#e04)\n\n本轮回查发现，216 GB和“三倍”**并非9月首次披露**。5月20日，大河财立方记者陈薇在阿里云峰会现场稿中已记录这两个说法及“带宽达1200GB”，原计划2027年第三季度推出。该稿未写带宽的每秒单位，也未定义片间互联，不能据此认定9月1,200 GB/s口径已在5月完整披露；该稿也没有FP8/FP4说明。9月材料把量产销售目标写为2027年第一季度。因此可确认“公开时间表前移”，但5月“推出”和9月“量产销售”的阶段措辞不同，不能进一步认定实际研发或量产已提前完成。[E05](#e05)[E02](#e02)\n\n截至本轮，没有取得V900送样、客户验收、量产完成、实际出货或可订购云实例的原始证据。官方演讲中“规模化上架”和运行超2万亿参数模型的对象明确为**M890 AI超节点**，不能作为V900交付证明；“650家客户”属于真武芯片总体口径，也不能归给V900。[E01](#e01)[E02](#e02) 对能力的合理判断是：更大显存和更强互联可能缓解大模型切分和通信压力，但收益成立仍取决于软件、拓扑、实际带宽及业务负载。后续最有价值的证据是正式规格书、附条件性能测试、V900实例订购文档及客户侧交付记录。\n\n### 规格与阶段表\n\n| 对象／项目 | 可核对内容 | 状态与边界 |\n|---|---|---|\n| V900身份 | 训练与推理处理器；9月22日发布 | 发布事件有一手证据支持[E01](#e01)[E02](#e02) |\n| 显存 | 216 GB | 仅能确认相关方宣称；类型、带宽未知[E02](#e02) |\n| 片间互联 | 1,200 GB/s | 仅能确认相关方宣称；方向、链路／聚合范围未知；非显存带宽[E02](#e02) |\n| 低精度 | 原生支持FP8、FP4 | 仅能确认相关方宣称；未给对应绝对算力[E02](#e02) |\n| 相对性能 | M890的三倍 | 仅能确认相关方宣称；比较条件缺失[E01](#e01)[E02](#e02) |\n| ICN超节点 | 原生内存语义、统一编址、千卡全带宽 | 仅能确认相关方宣称；现场媒体转述，未取得协议及实测[E03](#e03)[E04](#e04) |\n| 升级服务器 | V900＋ICN Switch＋磐脉＋镇岳 | 官方发布组合；IT之家称磐久服务器计划2027Q1上市[E02](#e02)[E04](#e04) |\n| 单一集群 | 最多50万卡 | 官方能力宣称；未证实已建设、交付或实测[E01](#e01)[E02](#e02) |\n| V900量产销售 | 计划2027Q1 | 未来计划；当前实际量产、交付未知[E02](#e02) |\n| 历史路线图 | 5月已披露216 GB、三倍及“1200GB”数字（未写/s或互联定义），计划2027Q3推出 | 现场记者原稿记录厂商路线图[E05](#e05) |\n\n\n## 2026-10-20-R02｜BR20X与新代验证（2026-10-20-S02）\n\n完成程度：**部分完成**。已取得点亮原公告、核清阶段及媒体口径；BR20X/BR2xx精确对应、性能条件、实际送样及量产日期仍缺公开证据。\n\n### 核验结论\n\n**10月8日公告确认的是未具名“新一代产品”完成启动测试、进入流片后验证，不能直接写成BR20X已量产。**港交所原公告第7页说明，客户送样和量产预计发生在未来数个季度，且须圆满完成验证及认证。公告没有给出点亮发生的具体日期，也未出现BR20X、BR2xx或H200型号。对“点亮及当前阶段”有一手披露支持；对已经送样、已通过客户认证或已量产，证据不足。[E07](#e07)\n\nBR20X是公司正式使用的型号：2025年12月招股书第220页将其列为基于第二代架构的下一代云端训推旗舰系列，规划原生FP8/FP4、更大更快内存及更高互连带宽，当时预计2026年商业上市。[E08](#e08) 公司8月3日发布的WAIC回顾则使用**BR2xx系列GPU**名称，介绍其Chiplet、FP8/FP4和基于BLink 2.0的16/128/1024卡方案。[E09](#e09) 两份材料在代际、用途及技术方向上相符，支持属于同一新代产品方向的推断，但本轮未取得公司明确解释两种名称一一对应、系列包含关系或具体SKU的文件；不能直接把BR2xx的所有系统规格填入BR20X单卡规格表。1024卡是厂商方案的扩展能力表述，本轮没有1024卡实机验证或交付证据。\n\n点亮信息也早于10月8日：时代财经白金蕾9月30日原文已经报道下一代GPU“近期已点亮”，并引述消息人士称性能超过H200，未披露测试方法。[E10](#e10) 10月8日北京商报报道明确称，记者从公司方面获悉BR20X点亮；但将H200比较另列为“另有消息称”。[E11](#e11) 这提高了点亮产品对应BR20X的可信度，同时保留其属于媒体采访转述的边界。\n\n**“对标／超过H200”尚不能形成可比较性能结论。**财联社10月8日文章使用“对标H200”，并写到2026年第四季度验证送测、2027年规模部署；这些内容不在所查配售原公告中。[E12](#e12) 第四波10月10日文章进一步将H200、第四季度送测归于星展研报，将2027年量产归于大和预测，并转述星展9月30日给出的H200约80%—120%性能范围。[E13](#e13) 本轮未获得该研报原件，亦未找到包含卡数、精度、模型、批量、序列长度、软件版本、功耗与测试方法的独立测试，故不采用80%—120%作为正式性能参数。“2027年第二季度起量”等精细日期也仅见媒体转述机构判断。[E11](#e11)\n\n供应准备已有公司资金投入披露，但不能据此判断产能全部锁定。公告第8页披露，截至9月30日，7月配售中专项用于下一代产品商业化与生产的资金已用约8.148亿港元；第7页同时将更新采购计划中的开支合并表述为“已承诺或计划”。[E07](#e07) 未公开供应商、采购合同、产能数量或取消条件，无法拆出具有约束力采购金额。其含义是公司在验证及客户适配认证期间提前备产，后续判断供给应看实际认证、送样、量产及客户验收披露。\n\n### 逐主张证据分级\n\n| 主张 | 判断 | 边界 |\n| --- | --- | --- |\n| 新一代产品完成启动测试进入流片后验证 | 有一手证据支持 | 公司10月8日披露，原公告未具名且无点亮具体日期；E07 |\n| 点亮产品为BR20X | 仅能确认相关方宣称 | 北京商报记者称从公司方面获悉；未取得具名型号的点亮原公告；E11 |\n| BR20X与BR2xx一一对应 | 证据不足 | 官方分别使用两种名称，技术方向相符；同代关联可推断，一一映射不可确定；E08、E09 |\n| 已送样、客户认证完成、已量产 | 证据不足 | [E07](#e07)仅为附条件未来计划 |\n| Q4验证送测／2027量产 | 仅能确认相关方宣称 | 媒体转述机构预期；未获研报原件或完成公告；E12、E13 |\n| 对标／超H200 | 仅能确认相关方宣称 | [E10](#e10)匿名消息、E11/[E12](#e12)媒体说法；实际相同性能结论证据不足 |\n| 1024卡方案扩展能力 | 仅能确认相关方宣称 | 官网方案，未取得实机验证或交付证据；E09 |\n| 已开展备产资金投入 | 有一手证据支持 | 公司披露专项资金已用；不能拆出约束采购金额或产能；E07 |\n\n### 阶段表\n\n| 时间 | 事项及可支持范围 | 状态 |\n| --- | --- | --- |\n| 2025-12-22 | 招股书：BR20X架构设计完成，正进行物理设计及流片验证；商业上市为2026年计划 | 公司披露的当时状态及计划；E08 |\n| 2026-07-17—20；官网8月3日回顾 | BR2xx及BLink 2.0超节点方案推出 | 有官方方案发布证据；不等于量产；E09 |\n| 2026-09-30 | 时代财经报道下一代GPU近期点亮、消息人士称超H200 | 媒体原始消息，缺测试条件；E10 |\n| 2026-10-08 | 公司公告：新一代产品完成启动测试、进入流片后验证 | 有一手披露；公告未具名；E07 |\n| 2026-10-08 | 北京商报称从公司方面确认BR20X点亮 | 可确认媒体采访转述；E11 |\n| 未来数季 | 客户送样及量产，取决于验证及认证完成 | 公司计划，未证实已发生；E07 |\n| 2026Q4／2027 | 验证送测／规模部署或量产 | 媒体及机构预期，未获研报原件或实际完成披露；E12、E13 |\n| 官网2026-10-10；活动9月18—19日 | 基于BR20X开发环境的SUPA黑客松 | 官方活动证据；未披露实物卡配置，不足以反推客户送样；E14 |\n\n\n## 2026-10-20-R03｜昆仑领奕项目（2026-10-20-S03）\n\n**完成程度：部分完成。** 已取得媒体附载的首轮结果公告图像并实际识读，以及9月24日六包采购的公开平台公告；尚未取得青海项目信息网原站结果页、完整技术参数和合同／验收文件。\n\n研究问题：确认原始结果、项目编号和包件；型号、数量、采购范围及税费；签约、交付、验收；9月29日同名结果是否替代壁仞。\n\n首轮公告复本所载项目编号为 **QHJY-FZB-2026-001**，预算625,894,760元，其中原包一174,080,000元、原包二451,814,760元；两包。公告记载采购公告日期9月16日、评标及定标日期均9月23日。原包一由上海壁仞科技股份有限公司中标，金额174,000,000元，比该包预算少80,000元，得分89.71，排序第一；原包二因递交响应文件的供应商不足三家废标。[E21](#e21) **有一手证据支持的范围限媒体所附结果公告复本的文字**，原站发布及复本完整性尚未独立核验，不能把媒体报道和相同公告图像累计为多个独立确认。\n\n交货条件的完整口径是“自合同签订完成后按合同约定支付相关金额，45个日历日内完成供货”。它是附条件的履约要求，缺合同日期和付款事实，不能从9月23日直接推算实际到货日期，也不能把公告当签约、交付或验收证明。[E21](#e21) 首轮复本的“各包要求”仅称详见技术参数；本轮未取得该参数文件。媒体称产品线为壁砺GPU，但未给可分离采购清单，**型号、卡数、服务器数量、软硬件及服务范围、含税性质均证据不足**。不得把1.74亿元除以推测卡数得单卡价格，也不能从其他壁砺案例反填BR166或BR20X。[E22](#e22)\n\n9月29日结果应作为同项目后续批次处理。9月24日公开平台公告显示预算451,814,760元、六包，金额与首轮废标包二一致；各包采购范围仍指向未附的技术参数。[E23](#e23) 9月30日芯东西记者陈骏达原稿明确称原包二拆为六包重新询比，新包一为中诚华隆1.8亿元、新包二为紫光数码约1.72亿元。[E24](#e24) 必联网9月29日结果公告转载可读到六家供应商，并存在结果预算452,640,760元、新包一预算180,826,000元与9月24日预算的差异；其项目编号被遮蔽，另有聚合索引给出QHJY-FZB-2026-005，但正文定位失败，**该编号仅为线索，不能当已核原件**。[E25](#e25) 因此不能把后轮“包一”当首轮壁仞包一的重授，也不能把预算差异无说明地抹平。拆包关系得到公开公告结构和署名媒体说明支持，原始更正文件仍缺。\n\n本次补查采购方全称、项目名＋合同／验收／交付、供应商官网及公告编号，没有取得壁仞此项目已签约、已交付或验收的客户／公司原件。后续报道中的“订单”与“交付能力”评价不能补足这些事实。项目可支持的商业判断停在中标公告复本所载阶段；不能据此认定收入、实际算力上线、供应链稀缺或客户使用率。继续推进最需要公开技术清单、签署合同、付款与到货记录、验收书，以及9月24日至29日预算变更公告。\n\n### 项目批次核对\n\n| 批次 | 编号／采购范围 | 结果及边界 |\n| --- | --- | --- |\n| 9/16采购、9/23评定标 | QHJY-FZB-2026-001；两包；总预算625,894,760元 | 原包一壁仞174,000,000元；原包二废标；媒体附载公告复本，原站未取[E21](#e21) |\n| 9/24重新采购 | 正文未见编号；六包；预算451,814,760元 | 包一180,000,000；包二172,441,024；包三43,348,069；包四22,447,300；包五5,167,423；包六28,410,944元；技术参数未公开取得[E23](#e23) |\n| 9/29后续结果 | 索引称QHJY-FZB-2026-005，未核原件；六包 | 新包一中诚华隆180,000,000元，新包二紫光数码172,423,680元；结果预算452,640,760元，与9/24有826,000元差异，未找到更正解释[E24](#e24)[E25](#e25) |\n\n\n## 3. 证据表\n\n### V900\n\n\n| 编号 | 支持范围 | 来源与原文链接 | 日期与定位 | 身份及局限 |\n|---|---|---|---|---|\n| \u003ca id=\"e01\">\u003c/a>E01 | 正式发布、三倍、50万卡；M890上架归属 | [阿里CEO吴泳铭演讲全文](https://www.alibabagroup.com/zh-CN/document-2039431633571938304) | 发布／事件2026-09-22；“第二基石是AI芯片”，网页行51—57 | 官方原文已读；性能及规模为厂商宣称，M890段与V900段明确分开 |\n| \u003ca id=\"e02\">\u003c/a>E02 | 216 GB、1200 GB/s、FP8/FP4、2027Q1量产上市；服务器组成 | [阿里云2026云栖大会：全栈AI路线图及全球市场拓展计划](https://www.alibabagroup.com/zh-CN/document-2041268239081668608) | 发布2026-09-25；事件9月22—24日；“平头哥公布真武V900及倚天CPU路线图”，行31—35 | 新取得官方原文；没有性能测试条件或实际交付信息 |\n| \u003ca id=\"e03\">\u003c/a>E03 | 超节点内存语义、统一编址、千卡全带宽；集群50万卡边界 | [国际金融报／马云飞，经东方财富承载](https://finance.eastmoney.com/a/202609223881304714.html) | 2026-09-22 17:01；行65—70 | 具名现场报道，明确“平头哥称”；非独立测试 |\n| \u003ca id=\"e04\">\u003c/a>E04 | 磐久服务器2027Q1上市；当时对外服务对象为M890 | [IT之家／汪淼现场报道](https://www.ithome.com/1/005/602.htm) | 2026-09-22 11:18:56；行45—55，芯片与服务器段 | 原始现场媒体稿；未披露测试方法 " \"采购\" \"青海嘉裕\" -site:sohu.com -site:scribd.com`\n24. `\"昆仑领奕\" \"174080000\"`\n25. `\"昆仑领奕\" \"合同\" \"壁仞\" -site:scribd.com -site:xueqiu.com -site:omniyq.com`\n26. `\"昆仑领奕\" \"合同公告\"`\n27. `\"昆仑领奕\" \"验收\" \"壁仞\"`\n28. `\"昆仑领奕\" \"QHJY-FZB\" \"002\"`\n29. `\"昆仑领奕\" \"结果公告\" site:qhxeyx.com OR site:qhxe.etrading.cn`\n30. `\"昆仑领奕\" \"QHJY\" -site:seccw.com -site:esmchina.com`\n31. `\"昆仑领奕\" \"625894760\" \"结果\"`\n32. `\"海东昆仑领奕信息技术有限公司\" \"验收\" OR \"交付\" OR \"合同签订\"`\n33. `\"昆仑领奕\" \"QHJY-FZB-2026-005\"`\n34. `\"昆仑领奕\" \"174000000\" \"技术参数\"`\n\n不同URL清单：\n- https://m.sohu.com/a/1081655097_120159035 （成功）\n- https://app.myzaker.com/news/article.php?pk=6ab48583b15ec060831209e8 （成功，原公告信息链）\n- https://www.icsmart.cn/142519/ （403，未尝试绕过）\n- https://qhxeyx.com/jyxx/002002/002002002/20260924/116540c0-9d72-4d6e-937c-cc7bf15e3a8b.html （成功）\n- http://www.qhei.net.cn/ （Internal Error；https同样失败，归一一个入口）\n- https://www.qhcxzb.com/ （发现原站前的域名试查，Internal Error，无证据）\n- https://zhidx.com/p/598496.html （成功，另分段定位一次）\n- https://www.ebnew.com/businessShow/710113665.html （部分成功，有登录遮蔽）\n- https://www.esmchina.com/news/14635.html （成功）\n- https://www.ixbang.com/bdrc/1002551-r630105/ （超时，未重复请求）\n- https://www.esmchina.com/d/file/news/2026-09-28/e355b089be2af7eaa9aecd7f1e19dd66.png （网页可定位图片，下载同图后实际识读）\n- https://oss.zhidx.com/e6ac48928738415bb0da527e2d05f2b8/6ad6af00/uploads/2026/09/6abc92cfdd9cd_6abc92cfdaa65_6abc92cfdaa26_%E5%9B%BE%E7%89%872.png （两次超时后停止）\n- https://mp.weixin.qq.com/s/zzXJVgZpg5AtAR-PEa7wPw （non-retryable error，未绕过）\n- https://www.qianlima.com/bid-634502253.html （部分成功，有会员遮蔽）\n- https://www.qianlima.com/gjxx/115568_20_4 （打开成功但查找无目标正文；不据索引填正式编号）\n- https://www.qianlima.com/zb/area_5/ （一次误点无关广东列表，不作证据，计入实际访问）\n\n收束依据：已追首轮原公告站点、准确编号／标题、公开平台、结果复本、后轮拆包与采购方／壁仞交付验收方向；原站入口持续无正文，参数文件需购买且未见公开附件，结果主要重复媒体同一公告链。后轮出现预算差异仍缺更正原件。没有新公开证据入口可解决型号、实际履约与验收；保留缺口，不能据“未检出”断言未签约或未交付。三条结果的作用分别为核复本文字、识别拆包、明确未证实履约，均不等同已收入。\n\n\n## 5. 交付核对\n\n已核对三项范围、候选与研究编号、正文证据锚点、原文定位、数值单位、发布时间与事件日期、来源链和访问边界。未将第一阶段摘要升级为规格事实，未作不可比性能排名，未将预算当成交价或把供货要求当实际履约。各项均列明剩余问题与依据证据而收束的原因。仅生成本单份正式研究报告；中间笔记和图片仅在系统临时目录。\n","references":{"../../初筛/2026-10-20/筛选报告.md":"screen-f567377ea3bdd98dd403a98e5be0e47b5d1f6e4f0aaad96d266161b33403e4f7"},"filename":"深挖报告.md","sourceUrl":"file:///Users/fch/Desktop/4%20MetaX%20%E5%AE%9E%E4%B9%A0/MetaX_%E5%B7%A5%E5%85%B7%E9%9B%86/%E5%B8%82%E5%9C%BA%E6%B4%9E%E5%AF%9FSKILL%20/AI%E8%8A%AF%E7%89%87%E7%AB%9E%E5%AF%B9%E8%B0%83%E7%A0%94Skill%E7%BB%84%E5%90%88/%E6%88%90%E6%9E%9C/%E6%B7%B1%E6%8C%96/2026-10-20/%E6%B7%B1%E6%8C%96%E6%8A%A5%E5%91%8A.md","sourcePath":"AI芯片竞对调研Skill组合/成果/深挖/2026-10-20/深挖报告.md","sourceState":"available","batch":"2026-10-20","screenId":"screen-f567377ea3bdd98dd403a98e5be0e47b5d1f6e4f0aaad96d266161b33403e4f7"},"report-ea95411acc8d4556bb0f23a65b5f460e9d37c9a45a395d6dcc4e66657e5a68ac":{"id":"report-ea95411acc8d4556bb0f23a65b5f460e9d37c9a45a395d6dcc4e66657e5a68ac","markdown":"# AI 芯片竞对市场观察报告\n\n## 观察概览\n\n研究批次：**2026-10-30**。资料截至：**2026-10-30 10:05:12（Asia/Shanghai）**。来源为[2026-10-30筛选报告及人工决定](../../初筛/2026-10-30/筛选报告.md)。本轮仅研究用户选择的 **2026-10-30-S01、S02、S03、S05、S09、S11**，范围依次为武汉950DT集群的配置与运营阶段、陕西电信M890采购范围与价格口径、齐鲁银行DCU实际应用、燧原长上下文推理的新增性与可用边界、摩尔线程S5000商业化和寒武纪云端产品经营。公开资料观察截至当轮读取时间，不等于客户项目的实时状态。\n\n| 研究编号 | 候选编号 | 核心观察 |\n| --- | --- | --- |\n| 2026-10-30-R01 | 2026-10-30-S01 | 武汉出现具名投资方和千卡部署报道，增量在地方项目落地；28日点亮与29日上线存在日期口径差异。“首个”也不能覆盖此前10月15日首套点亮。[科创板日报记者稿](https://api3.cls.cn/share/article/2518933?app=&os=android&selected=&source=&sv=869)、[华为10月15日原文](https://www.hiascend.com/activities/dynamic-news/803)。 |\n| 2026-10-30-R02 | 2026-10-30-S02 | 11942.76万元是含税寻源最高限价，采购还涉及CPU服务器及部署服务。256卡是需求规模，不能当成交或裸卡单价依据。[快科技报道](https://news.mydrivers.com/1/1161/1161478.htm)、[采招网列表](https://sx.bidcenter.com.cn/zhaobiao/zbkeyw-33006-0-0-0.html)。 |\n| 2026-10-30-R03 | 2026-10-30-S03 | 百余卡部署之外，媒体补充70个AI业务场景测试选型和从OCR逐步扩容的路径；场景测试数量不能当作70个生产应用。[金融界／金曦](https://finance.jrj.com.cn/2026/10/27152158885357.shtml)。 |\n| 2026-10-30-R04 | 2026-10-30-S05 | 百万token推理在8月Hy4 preview适配供稿中已出现，10月大会更多是延续展示；多层KV缓存有明确技术方向，但没有可复现的版本、配置与吞吐依据。[8月厂商供稿](https://www.laoyaoba.com/n/1095357)、[10月大会供稿](https://www.ijiwei.com/n/1128148)。 |\n| 2026-10-30-R05 | 2026-10-30-S09 | 正式半年报支持“以云端产品为主的商业化”；6.60亿元夸娥合同已在上半年交付确认收入。三季报增长与S5000有关，但公司收入仍不能拆算S5000收入或卡价。[半年报第66、144页](https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-8/2026-08-10/12484622.PDF)、[三季报](https://static.cninfo.com.cn/finalpage/2026-10-29/1225636387.PDF)。 |\n| 2026-10-30-R06 | 2026-10-30-S11 | 云端收入基础有半年报支持，三季度继续增长；库存同时包含订单需求和预测备货，不能推成已锁定销量。管理层称未沟通过明年百万颗出货说法。[半年报](https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12484346&stockid=688256)、[每经现场问答报道](https://www.nbd.com.cn/articles/2026-10-26/4618733.html)。 |\n\n## 逐项信息与分析\n\n### 2026-10-30-R01：华为／武汉昇腾950DT千卡集群\n\n**变化在项目部署，而非规格首次出现。** IT之家10月29日报道，10月28日湖北省人工智能创新发展大会上，由湖北科投投资建设的1024卡集群正式点亮，项目启动到点亮约一个月。科创板日报余诗琪的29日快讯则称“今日上线”。两稿支持武汉项目的公开落地消息，但尚不能精确统一点亮、上线与正式运营日期。[IT之家／沁沧，10月29日13:12，正文已读](https://www.ithome.com/1/019/419.htm)；[财联社页面承载记者快讯，10月29日13:36，相关正文已读](https://api3.cls.cn/share/article/2518933?app=&os=android&selected=&source=&sv=869)。\n\n厂商当前Atlas 950产品页的1024卡配置上限，与项目报道中的1 EFLOPS FP8及256TB统一编址在系列口径上相符，但产品页不是武汉实装清单：\n\n| 层次 | 厂商原始口径 | 对项目判断的限制 |\n| --- | --- | --- |\n| 系统形态 | 16个计算柜＋4个灵衢互联柜，计算柜与互联柜液冷 | 武汉具体机柜与供电验收未披露，不能直接认定完全满配 |\n| 计算配置 | 最多1024颗昇腾950DT、256颗鲲鹏950；最大1 EFLOPS mxFP8／FP8／HiF8 | 峰值规格不是某个万亿参数模型的实测训练能力 |\n| 内存口径 | 256TB全局内存统一编址；另列最多1024×96GB片上内存 | 256TB不能改写为256TB HBM或单任务无条件可用显存 |\n\n以上来自[昇腾官方产品页“产品特性／技术规格”，本轮正文及规格表已读，页面未标发布日期](https://www.hiascend.com/hardware/cluster)。\n\n“全国首个”应保留来源限定。华为10月15日原文已称首套1024卡Atlas 950液冷超节点为Step系列提供算力服务，未在相关段落给出地点；因此武汉可作为新增具名地方部署案例，不能自动解释为全国第一次点亮，也不能认定它与15日机器是同一套或不同一套设备。[昇腾社区，10月15日，“首套1024卡”段，官方正文已读](https://www.hiascend.com/activities/dynamic-news/803)。\n\n据此观察，供给信号已从产品展示推进到具体地区和建设主体。公开信息仍不足以判断开放购买、付费利用率及持续业务负载；这些条件决定该项目后续能否代表可复制的算力服务收入，而不是仅凭点亮规模判断商业成熟度。本轮未取得客户侧运营确认或价格，保留未知。\n\n### 2026-10-30-R02：平头哥／陕西电信真武M890寻源\n\n**采购意向具体，但阶段仍停在寻源证据。** 快科技10月29日转述27日公告：计划配置32台服务器，每台8张M890 OAM加速卡，合计256卡；11942.76万元含税为最高限价，超价否决；合同后30个工作日供货，原厂免费质保及技术支持为3年。这些是拟采购和履约要求，不是已经签约或已经供货。[快科技／红茶，正文相关段落可读，页面另有权限提示，未继续追取受限部分](https://news.mydrivers.com/1/1161/1161478.htm)。\n\n本轮新增读到采招网27日列表，明确还配置4台CPU服务器，包含设备供货、安装部署、系统调试及运维移交。蓝燕云索引进一步列出管理／网关设备、组网、平台联调和测试验收，但其详情页两次超时，**这些新增细项仅按摘要线索保留**；不能冒充已读电信原公告。[采招网列表，正文片段已读](https://sx.bidcenter.com.cn/zhaobiao/zbkeyw-33006-0-0-0.html)；[蓝燕云公告聚合页，仅搜索摘要](https://sn.zhaobiao.lanyancloud.com/notice/34a5b41ebb1246a8)。\n\n由此可以判断，预算的对象是一组设备及交付服务。不能用11942.76万元除256卡得到M890成交价；媒体“GPU与CPU配比64∶1”实际用了256张加速卡对4台配套CPU服务器，混合了卡与整机单位，也没有计入GPU服务器内部的主处理器，不能当作硬件GPU／CPU芯片比例。[网通社10月29日报道，正文已读，其“64∶1”为媒体表述](https://tech.news18a.com/article/15618)。\n\n市场意义在于：省级运营商的需求已经落实到指定平台、数量和交付约束，而不是泛合作。是否形成订单仍取决于合作伙伴确定及后续采购结果。本轮沿项目名、公告聚合入口及结果方向查找，未取得可确认的成交、合同或验收信息；未检出不能证明这些阶段没有发生。不采用媒体将其称为“1.2亿元订单”的推断，也不把寻源截止后自动视作成交。\n\n### 2026-10-30-R03：海光／齐鲁银行国产化AI算力池\n\n**从“百余卡”补充到应用选择与扩容路径。** 北京商报王天逸10月26日转述海光称，DCU近日落地齐鲁银行AI算力池，累计部署百余块，覆盖OCR、多模态及千亿参数级模型。部署日期未给，“累计”不能按本月新增销量计算。[同花顺承载北京商报稿，10月26日21:34，正文已读](https://stock.10jqka.com.cn/20261026/c681105011.shtml)。\n\n金融界金曦27日进一步写到，此前进行70个AI业务场景的测试选型，从OCR切入，逐步延伸至多模态和大模型，并采用统一集群调度与存量业务适配方案。这使案例的价值从设备数量进一步延伸到业务迁移，但它仍是媒体案例描述：70是测试选型范围，不能扩大为70个已上线生产系统，也没有公开每个场景的验收或使用率。[金融界，10月27日15:21，“百卡级部署／从场景起步”部分，重试后正文已读](https://finance.jrj.com.cn/2026/10/27152158885357.shtml)。\n\n据此判断，这条路径对区域银行有参考价值：先验证存量应用再扩充共享算力池，可能降低一次性迁移和运维压力。这里的“可能”是研究分析，不能据报道确认实际节约金额或投资回报。两篇媒体稿不能视为银行与供应商两方独立确认；本轮未取得银行侧确认、精确型号及金额，因而不推算海光收入，也不由通用DCU能力介绍反推该项目用了某代产品。\n\n### 2026-10-30-R04：燧原科技／百万token推理与KV缓存优化\n\n**本轮最有用的修正是时间线。** 10月29日大会供稿称，通过算子融合、显存优化、智能调度、高效传输与多层级KV Cache，发挥PD分离优势，实现百万token长上下文高吞吐稳定推理。该稿未给模型、卡数、缓存介质、软件版本及量化服务指标。[爱集微承载燧原供稿，正文事件日期10月29日，相关段落已读；不是独立实测](https://www.ijiwei.com/n/1128148)。\n\n8月28日燧原的Hy4 preview适配供稿已经把百万token、PD分离、集群大EP及KV Cache优化放在同一方案中，并称满足业务SLO。该稿给出了Hy4 preview这一模型背景，足以说明“百万token能力”并非10月首次提出；但不能据此认定10月展出的所有配置都等同8月方案。[爱集微承载厂商原稿，8月28日20:36，正文已读](https://www.laoyaoba.com/n/1095357)。\n\n技术方向是把长上下文压力作为整套推理服务的问题处理，覆盖计算、通信、调度与缓存，而非单靠更大显存。这是对两份厂商材料的分析；现有材料不能把多层缓存进一步填成指定的HBM／主存／SSD结构，或推定某种公开软件版本已经交付。大会所说“第三代算力产品”也不足以把现场方案直接对应到第四代L600或某一张卡。\n\n因此，市场观察由初筛的“可能新能力”调整为“既有能力主张的继续展示，具体工程交付仍待观察”。下一次值得关注的增量是可用版本与同条件下的首字延迟、逐token延迟和吞吐，而不是再次出现“支持1M”的宣传。模型自优化或其他硬件的吞吐数字不移用为燧原测试结果。本轮未安装环境或运行模型。\n\n### 2026-10-30-R05：摩尔线程／S5000商业进展与收入边界\n\n**正式披露支持云端产品为收入主体，但不支持S5000单型号拆分。** 半年报合并口径：上半年云端产品收入1692662049.69元，占总收入1736309066.25元约97.49%（本轮按两数相除）；第66页记载6.60亿元夸娥智算集群合同已在上半年交付并确认收入。这是既有商业化依据，不能再次计作三季度或10月新签订单。[2026年半年报，第66、144页，新浪披露原件复本，相关正文及表格已读](https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-8/2026-08-10/12484622.PDF)。\n\n| 期间／对象 | 原始披露数值 | 可支持的判断 |\n| --- | --- | --- |\n| 第三季度公司营业收入 | 1552307664.26元，同比＋1773.92% | 单季度公司收入扩大，不等同S5000收入 |\n| 前三季度公司营业收入 | 3288616730.51元，同比＋319.15% | 累计收入规模，不能再加上已包含的集群合同 |\n| 前三季度经营现金流净额 | −3309197894.09元 | 收入增长同时伴随采购现金占用，不能用收入代替现金回收 |\n\n数据来自[三季报第1页](https://static.cninfo.com.cn/finalpage/2026-10-29/1225636387.PDF)。第3页将增长与S5000等智算产品在CSP、TSP、运营商等客户中加速落地关联，并将经营现金净流出归因于扩大生产和战略备货。它没有给出S5000销售额、卡数、客户分项及成交价。半年报的97.49%不能直接套到三季度，更不能把云端产品收入全部改称裸芯片收入。[同份三季报第3页，正式披露相关段落已读](https://static.cninfo.com.cn/finalpage/2026-10-29/1225636387.PDF)。\n\n观察重点由“营收增长”推进到“云端收入结构及合同转收入已有依据”。同时，集群业务包含不同设备和服务，收入扩张、单卡销量及单位经济性仍是不同问题。现有披露未支持对集群金额和卡收入进行重复累计；也没有具体证据可判断存在重复确认收入。官网10月28日图解、媒体称28日晚发布与披露库29日日期保留各自口径，不据此构造两次新披露。\n\n### 2026-10-30-R06：寒武纪／云端产品经营、备货与销售传闻\n\n**收入结构有更直接的依据。** 半年报合并收入分解列上半年云端产品线5994218575.37元、公司总收入5995573619.61元，云端占比约99.98%（本轮计算）；说明此前增长确以云端产品为主，而非必须借公司总收入猜测。该口径仍不是思元某一型号销量或收入。[2026年半年报，附注“营业收入、营业成本的分解信息”，新浪承载公司公告，表格已读](https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12484346&stockid=688256)。\n\n三季报列前三季度公司营业收入9526401914.25元，第三季度3530828294.64元；截至9月末，存货11664658998.55元、预付款3044359094.99元。它们分别是期间收入与期末资产，不能相加为订单储备，也不能将库存全部理解成已售芯片。[2026年三季报第1、6页，巨潮资讯原件，相关表格已读](https://static.cninfo.com.cn/finalpage/2026-10-24/1225620944.PDF)。\n\n10月26日业绩会每经报道补充：管理层称采购计划同时依据客户订单与未来需求预测；对市场“明年出货超100万颗”说法，回答是**从未进行相关沟通**，并未提供新的出货指引。思元690销售及导入大厂的问题也没有得到具体数量和时点。这里否认的是沟通过该数字，不能延伸为对所有未来产能的确定结论。[每日经济新闻／可杨，10月26日20:17，原创报道正文已读](https://www.nbd.com.cn/articles/2026-10-26/4618733.html)。\n\n公司研究室26日的业绩会整理还转述“前三季度主要来自云端且不包含智能计算集群系统业务”；这一更细分说法有可读媒体／社区入口，但本轮未取得上证路演原始问答，不把它升级为已经核读的交易所披露。[雪球承载公司研究室文章，10月26日21:12，正文已读](https://www.xueqiu.com/1479845370/413930436)。正式半年报已提示原材料采购价格上涨、通过备货和迭代应对；这属于成本压力，不能当作公司芯片售价已经上涨的证据。[半年报“行业风险”，公司公告正文已读](https://money.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id=12484346&stockid=688256)。\n\n据此，云端产品的商业收入基础比初筛仅用总收入表述更明确；未来销售判断仍应观察订单转交付与库存周转，避免把资产规模或市场出货传闻当确定销量。客户、型号贡献及具体成交价格仍未披露，本轮不据此确认690量产或估算单卡价格。\n\n## 后续关注点\n\n- **项目阶段**：武汉从点亮／上线到实际算力服务，陕西从寻源到合作伙伴／合同，齐鲁银行从场景测试到持续生产负载，是三类不同后续节点。\n- **燧原软件交付**：公开版本、硬件配置及可比较服务指标，比重复“支持百万token”更可能改变判断。\n- **产品销售结构**：摩尔线程关注S5000及集群收入拆分；寒武纪关注云端收入的型号／客户构成和库存转化。后续新材料沿本批次候选回链，不自动启动其他候选。\n","references":{"../../初筛/2026-10-30/筛选报告.md":"screen-dbbd99cdd0bbf231197f2c19a4e57d922ee9165d7ec04217ec6d610592471d1d"},"filename":"深挖报告.md","sourceUrl":"file:///Users/fch/Desktop/4%20MetaX%20%E5%AE%9E%E4%B9%A0/MetaX_%E5%B7%A5%E5%85%B7%E9%9B%86/%E5%B8%82%E5%9C%BA%E6%B4%9E%E5%AF%9FSKILL%20/AI%E8%8A%AF%E7%89%87%E7%AB%9E%E5%AF%B9%E8%B0%83%E7%A0%94Skill%E7%BB%84%E5%90%88/%E6%88%90%E6%9E%9C/%E6%B7%B1%E6%8C%96/2026-10-30/%E6%B7%B1%E6%8C%96%E6%8A%A5%E5%91%8A.md","sourcePath":"AI芯片竞对调研Skill组合/成果/深挖/2026-10-30/深挖报告.md","sourceState":"available","batch":"2026-10-30","screenId":"screen-dbbd99cdd0bbf231197f2c19a4e57d922ee9165d7ec04217ec6d610592471d1d"},"report-a8637c0c8618deb4ec2aa07d2d184e645fc2b66d89fe490d21e73d1b5cd22130":{"id":"report-a8637c0c8618deb4ec2aa07d2d184e645fc2b66d89fe490d21e73d1b5cd22130","markdown":"# AI 芯片竞对市场观察\n\n## 观察概览\n\n研究批次：**2026-11-05**。资料截至 **2026-11-05 11:05:00（Asia/Shanghai）**。用户从[2026-11-05筛选报告](../../初筛/2026-11-05/筛选报告.md)选择三条推荐项，范围为厦门昇腾950DT点亮与验收、新石器S5000训练验证与商业安排、纵横股份深算三号DCU适配与部署。\n\n| 研究编号 | 候选编号 | 核心观察 |\n| --- | --- | --- |\n| 2026-11-05-R01 | 2026-11-05-S01 | 厦门950DT于10月30日举行点亮仪式，成为当地已有384超节点之外的新算力来源。全量验收、卡数与该批设备的收费服务仍待确认。 [项目方供稿](https://www.prnasia.com/story/554029-1.shtml) · [海峡导报现场报道](https://hxdb.fjdaily.com/pc/con/202610/31/content_574141.html) |\n| 2026-11-05-R02 | 2026-11-05-S02 | 新石器已在无锡惠山使用S5000进行自动驾驶训练验证，三方于10月31日签署战略合作。走访报道补充一期2,112卡、10月开始商业运营，接近万卡是新石器后续需求。 [惠山发布](https://www.thepaper.cn/newsDetail_forward_34385069) · [芯东西走访](https://zhidx.com/p/606641.html) |\n| 2026-11-05-R03 | 2026-11-05-S03 | 纵横股份公布深算三号DCU联合测试时延，覆盖检测、检索和视频处理。公开材料只明确到适配测试阶段，设备安装位置与采购进展仍待确认。 [纵横股份测试原文](https://www.jouav.com/zh/news/elementor-23709.html) |\n\n## 逐项信息与分析\n\n### 2026-11-05-R01 华为／厦门燧弘华创昇腾950DT点亮\n\n10月19日弘信电子与华为举行首批设备交付仪式。10月21日刊出的项目消息分别给出10月23日前首批服务器到货、28日前集群点亮、30日前全量上线验收的计划。10月30日项目方供稿确认当天在厦门举行950DT点亮仪式，10月31日《海峡导报》记者报道补充会场位于中国移动福建公司厦门分公司。现有报道支持仪式日期和地点，无法据此确认设备首次通电日期、计划节点是否全部兑现，或会场是否就是机房。 [10月21日交付消息](https://jinguxun.com/article/news/10934965) · [10月30日项目方供稿](https://www.prnasia.com/story/554029-1.shtml) · [10月31日海峡导报](https://hxdb.fjdaily.com/pc/con/202610/31/content_574141.html)\n\n此次点亮对应厦门Token工厂的新一批算力，项目方称将与本地已布局的昇腾384超节点及异构资源形成互补。华为产品页列有最多1024个NPU的Atlas 950 SuperPoD液冷配置，厦门材料只明确950DT，未披露机柜、拓扑和实际卡数。此前[武汉项目观察](../2026-10-30/深挖报告.md)中的1024卡也属于另一个具名项目。 [项目方供稿“昇腾950DT点亮”段](https://www.prnasia.com/story/554029-1.shtml) · [昇腾社区液冷超节点规格](https://www.hiascend.com/hardware/cluster?tag=900)\n\n“推理吞吐较初始上线提升50%以上”在10月21日已出现，归因于分桶路由、预填充与解码资源配比调整及并行策略优化，10月30日供稿在双方联合创新段重述。两份稿件均未明确测试使用厦门这批950DT，也未给模型、精度和绝对吞吐。该数字可作为双方推理优化经验的线索，950DT项目的单位词元成本和增益仍待带配置的服务数据。 [10月21日联合创新段](https://jinguxun.com/article/news/10934965) · [10月30日算力产业段](https://www.prnasia.com/story/554029-1.shtml)\n\nHonMaaS与中国移动天工平台厦门方案给出了模型调度、服务交付及私有化部署的入口。供稿与现场报道所列机器人企业属于首批生态合作接入范围，未说明各家是否已在这批950DT上承载生产任务或付费。项目当前可记录为具名算力节点点亮，服务规模仍取决于后续验收、对外开放和实际负载。 [燧弘华创供稿](https://www.prnasia.com/story/554029-1.shtml) · [海峡导报](https://hxdb.fjdaily.com/pc/con/202610/31/content_574141.html)\n\n### 2026-11-05-R02 摩尔线程／新石器S5000训练验证与无锡惠山扩容\n\n惠山发布将三方战略签约日期明确为**10月31日**。惠山发布和《上海证券报》均报道新石器已基于S5000进行自动驾驶模型训练验证，并计划扩大训练规模。中关村在线对验证和部署阶段的表述更强，但未提供模型、验证卡数、验收数据或订单条款。现有材料可记录具名训练验证与战略签约，接近万卡的需求、中心万卡级扩容规划以及实际下单规模应分别跟踪。同期披露的10亿元是新石器华东智能无人车总部项目的计划总投资。 [惠山发布](https://www.thepaper.cn/newsDetail_forward_34385069) · [上海证券报援引摩尔线程](https://finance.sina.com.cn/roll/2026-11-02/doc-inixicic0561565.shtml) · [中关村在线](https://ai.zol.com.cn/1268/12683976.html)\n\n相较[10月20日的一期研究](../2026-10-20-02/深挖报告.md)，11月2日芯东西机房走访补充了一期的运营节点及配置，6月点亮、7月试运行、10月开始商业运营，共264台GPU服务器、2,112张S5000。惠山发布沿用“2000卡”的规模口径，两者均指一期。走访稿列算力使用率92.9%、付费算力占比59.7%，未给完整统计窗口和分母定义，不能折算为付费卡数或新石器用量。 [芯东西走访“技术架构”与运营段](https://zhidx.com/p/606641.html) · [惠山发布一期运营段](https://www.thepaper.cn/newsDetail_forward_34385069)\n\n现有项目已经给出从共享集群运营到具名自动驾驶训练验证的案例。若新石器后续锁定长期资源或出现分期扩容交付，将能进一步判断其需求是否转化为集群增量。目前未取得可核对的训练模型与并行配置、实际用卡量、购买或租赁条款和交付时间。 [上海证券报](https://finance.sina.com.cn/roll/2026-11-02/doc-inixicic0561565.shtml) · [芯东西走访](https://zhidx.com/p/606641.html)\n\n### 2026-11-05-R03 海光／纵横股份深算三号DCU适配\n\n纵横股份11月3日披露近期完成联合适配，涉及目标检测、多模态理解、图像分割和视频编解码。披露将机载与地面智能分析软件描述为后续推进迁移的范围，未给出测试硬件所在位置、具体板卡SKU、功耗或精度。以下均为项目方报告的数据。 [纵横股份官网新闻列表](https://www.jouav.com/zh/news/) · [测试原文](https://www.jouav.com/zh/news/elementor-23709.html)\n\n| 负载 | 项目方披露与可比条件 |\n| --- | --- |\n| YOLO11目标检测 | VisDrone2019、10类目标、384×640输入。单帧推理10.9 ms，预处理1.9 ms、后处理1.3 ms，未包含可确认的图传或整链路耗时。 [纵横股份测试原文](https://www.jouav.com/zh/news/elementor-23709.html) |\n| 图像检索 | Qwen3-VL-Embedding-8B通过以文搜图和以图搜图验证，后者Top 5结果相似度均在98%以上，单次推理0.9秒。相似度的口径不足以计算检索准确率。 [纵横股份测试原文](https://www.jouav.com/zh/news/elementor-23709.html) |\n| 编解码与烟火检测 | FFmpeg硬件加速下，1080p视频单帧解码1.078 ms、编码3.37 ms。烟火检测基于ONNX Runtime与ROCm执行后端，单帧推理0.041至0.047秒，项目方CPU对照为0.47秒，未披露CPU配置。 [纵横股份测试原文](https://www.jouav.com/zh/news/elementor-23709.html) |\n\n相比[此前齐鲁银行DCU观察](../2026-10-30/深挖报告.md)，本次是独立行业场景，新增信息是具名应用方明确了DCU代际、负载和部分可定位的时延数据。案例可作为软件迁移和现场分析负载的选型线索。要判断能否进入常态化部署，仍需项目方说明机载、地面站或后台的具体分工，以及实际采购、现场功耗和持续运行表现。 [纵横股份测试原文](https://www.jouav.com/zh/news/elementor-23709.html)\n","references":{"../../初筛/2026-11-05/筛选报告.md":"screen-e9f61655e420cd3bfae205b81e84c9572cf46ab674efe3ea72107dbc0142612b","../2026-10-30/深挖报告.md":"report-ea95411acc8d4556bb0f23a65b5f460e9d     const terms = query.toLocaleLowerCase().split(/\s+/).filter(Boolean);
    const events = data.events.filter(event => event.vendor === view.vendor && terms.every(term => event.search.includes(term)));
    content.innerHTML = `<p class="reader-eyebrow">全部研究 · 按研究时间倒序</p><h2 class="reader-title" id="reader-title">${escape(view.vendor)}</h2><ul class="research-list">${events.map(event => itemHtml(event, true)).join('')}</ul>`;
  }

  function renderMaintenance() {
    $('reader-context').textContent = '收录情况';
    content.innerHTML = `<p class="reader-eyebrow">研究档案维护</p><h2 class="reader-title" id="reader-title">有 ${data.diagnostics.length} 项需要核对</h2><div class="reader-note">已收录研究继续保留。修复对应报告或路径后，重新运行看板更新即可补录。</div>${data.diagnostics.map(d => `<div class="diagnostic-item">${escape(d.message)}<small>${escape(d.path)}</small></div>`).join('')}`;
  }

  function closeReader() { reader.close(); }
  $('reader-close').addEventListener('click', closeReader);
  reader.addEventListener('click', e => { if (e.target === reader && e.clientX < reader.getBoundingClientRect().left) closeReader(); });
  reader.addEventListener('close', () => {
    document.body.style.overflow = '';
    currentView = null; viewStack = [];
    if (location.hash.startsWith('#event=')) history.replaceState(null, '', location.pathname + location.search + previousHash);
  });
  $('reader-back').addEventListener('click', () => {
    const previous = viewStack.pop();
    if (!previous) return;
    setView(previous.view);
    $('reader-scroll').scrollTop = previous.scroll;
  });
  document.addEventListener('click', e => {
    const button = e.target.closest('[data-event],[data-document],[data-vendor-history],[data-anchor]');
    if (!button) return;
    e.preventDefault();
    if (button.dataset.event) setView({ type: 'event', id: button.dataset.event, version: Number(button.dataset.version || 0) }, reader.open && currentView?.type !== 'event');
    if (button.dataset.document) setView({ type: 'document', id: button.dataset.document }, true);
    if (button.dataset.vendorHistory) setView({ type: 'vendor', vendor: button.dataset.vendorHistory });
    if (button.dataset.anchor) {
      const anchor = content.querySelector(`[id="${button.dataset.anchor.replace(/[^\w-]/g, '')}"]`);
      if (anchor) { anchor.scrollIntoView({ block: 'center' }); const row = anchor.closest('tr') || anchor; row.classList.add('highlight-anchor'); setTimeout(() => row.classList.remove('highlight-anchor'), 1800); }
    }
  });
  $('search').addEventListener('input', e => { query = e.target.value.trim(); renderGrid(); });
  document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!reader.open) $('search').focus(); } });
  $('maintenance').addEventListener('click', () => setView({ type: 'maintenance' }));
  $('as-of').textContent = data.asOf ? `报告资料截至 ${date(data.asOf, true)} · Asia/Shanghai` : '从已有深挖报告中，了解市场信息与观察。';
  $('updated-at').textContent = data.lastSuccessfulAt ? `最近成功更新于 ${date(data.lastSuccessfulAt, true)}` : `看板生成于 ${date(data.generatedAt, true)}`;
  if (data.diagnostics.length) { $('maintenance').hidden = false; $('maintenance').textContent = `${data.diagnostics.length} 项收录待核对 ›`; }
  renderGrid();
  if (location.hash.startsWith('#event=')) {
    const id = decodeURIComponent(location.hash.slice(7));
    if (byEvent.has(id)) setView({ type: 'event', id, version: 0 });
  }
})();
</script>
</body>
</html>
